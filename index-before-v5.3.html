function GitHubConfigGuide({ cfg, token }) {
  const [checking, setChecking] = useState(false);
  const [checks, setChecks] = useState([]);
  const pdfRepo = resolvePdfRepoNameFromCfg(cfg, new Date().getFullYear());
  const pdfBranch = cfg.pdf?.branch || 'main';
  const tokenUrl = 'https://github.com/settings/personal-access-tokens/new';
  const mainRepoUrl = `https://github.com/${cfg.owner}/${cfg.repo}`;
  const mainPagesUrl = `https://github.com/${cfg.owner}/${cfg.repo}/settings/pages`;
  const pdfRepoUrl = `https://github.com/${cfg.owner}/${pdfRepo}`;
  const pdfPagesUrl = `https://github.com/${cfg.owner}/${pdfRepo}/settings/pages`;

  async function runChecks() {
    setChecking(true);
    const out = [];
    const push = (level, name, detail) => out.push({ level, name, detail });
    try {
      if (!token) {
        push('bad', 'PAT', '未设置令牌。管理模式无法写入 GitHub。');
        setChecks(out); return;
      }

      const userRes = await fetch(cacheBustUrl('https://api.github.com/user'), { headers: ghHeaders(token), cache: 'no-store' });
      if (!userRes.ok) {
        const txt = await userRes.text();
        push('bad', 'PAT', `令牌无效或不可用：${userRes.status} ${userRes.statusText} ${shortErr(txt, 100)}`);
        setChecks(out); return;
      }
      const user = await userRes.json();
      push('ok', 'PAT', `认证成功：${user.login || 'authenticated user'}`);

      const mainRes = await fetch(cacheBustUrl(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}`), { headers: ghHeaders(token), cache: 'no-store' });
      if (!mainRes.ok) {
        push('bad', '主仓库', `无法访问 ${cfg.owner}/${cfg.repo}：${mainRes.status} ${mainRes.statusText}`);
      } else {
        const main = await mainRes.json();
        const canPush = !!main.permissions?.push;
        push(canPush ? 'ok' : 'warn', '主仓库', canPush ? `可写；默认分支 ${main.default_branch}` : '可以读取，但 API 未显示 push/write 权限。请检查 Contents: Read and write。');
        if (main.default_branch && main.default_branch !== cfg.branch) {
          push('warn', '主仓分支', `配置为 ${cfg.branch}，仓库默认分支为 ${main.default_branch}。如果你确实使用 ${cfg.branch} 可忽略。`);
        } else {
          push('ok', '主仓分支', `使用 ${cfg.branch}`);
        }
      }

      try {
        const meta = await ghGetContentMeta(cfg.owner, cfg.repo, cfg.indexPath, token, cfg.branch);
        if (meta) push('ok', 'index.json', `找到 ${cfg.indexPath}，可读取 SHA。`);
        else push('warn', 'index.json', `未找到 ${cfg.indexPath}。首次使用时需要创建，或检查路径/分支。`);
      } catch (e) {
        push('bad', 'index.json', shortErr(e.message, 180));
      }

      try {
        const site = await ghGetPagesSite(cfg.owner, cfg.repo, token);
        if (!site) {
          push('bad', '主仓 Pages', '尚未启用 GitHub Pages。请在 Settings → Pages 配置 Deploy from a branch。');
        } else {
          const src = site.source || {};
          const branchOk = !src.branch || src.branch === cfg.branch;
          push(branchOk ? 'ok' : 'bad', '主仓 Pages', `可读取；source=${src.branch || '?'}${src.path || '/'}；build_type=${site.build_type || 'legacy'}。${branchOk ? '上传后可由 v3.2 主动触发 build。' : `当前写入分支为 ${cfg.branch}，需要统一。`}`);
          try {
            const latest = await ghGetLatestPagesBuild(cfg.owner, cfg.repo, token);
            if (latest) push('ok', '主仓 Pages 最新构建', `${latest.status || 'unknown'} · commit ${(latest.commit || '').slice(0,8) || '—'}`);
          } catch (e) { push('warn', '主仓 Pages 最新构建', shortErr(e.message, 160)); }
        }
      } catch (e) {
        push('bad', '主仓 Pages', `${shortErr(e.message, 160)}；若为 403，请给 PAT 增加 Pages: Read and write。`);
      }

      if (cfg.pdf?.enabled !== false) {
        const pdfRes = await fetch(cacheBustUrl(`https://api.github.com/repos/${cfg.owner}/${pdfRepo}`), { headers: ghHeaders(token), cache: 'no-store' });
        if (pdfRes.status === 404) {
          push('warn', 'PDF 仓库', `未找到 ${pdfRepo}。建议先手动创建，再把它加入 fine-grained PAT 的仓库授权。`);
        } else if (!pdfRes.ok) {
          push('bad', 'PDF 仓库', `检查失败：${pdfRes.status} ${pdfRes.statusText}`);
        } else {
          const pdfData = await pdfRes.json();
          const canPush = !!pdfData.permissions?.push;
          push(canPush ? 'ok' : 'warn', 'PDF 仓库', canPush ? `${pdfRepo} 可写。` : `${pdfRepo} 可读但未确认写权限；请给 Contents: Read and write。`);
          if (pdfData.default_branch && pdfData.default_branch !== pdfBranch) {
            push('warn', 'PDF 分支', `配置为 ${pdfBranch}，仓库默认分支为 ${pdfData.default_branch}。`);
          } else {
            push('ok', 'PDF 分支', `使用 ${pdfBranch}`);
          }
          try {
            const site = await ghGetPagesSite(cfg.owner, pdfRepo, token);
            if (!site) {
              push('bad', 'PDF Pages', '尚未启用 Pages。请使用 Deploy from a branch。');
            } else {
              const src = site.source || {};
              const branchOk = !src.branch || src.branch === pdfBranch;
              push(branchOk ? 'ok' : 'bad', 'PDF Pages', `可读取；source=${src.branch || '?'}${src.path || '/'}；build_type=${site.build_type || 'legacy'}。${branchOk ? '上传后可主动 build。' : `应改为 ${pdfBranch}。`}`);
              try {
                const latest = await ghGetLatestPagesBuild(cfg.owner, pdfRepo, token);
                if (latest) push('ok', 'PDF Pages 最新构建', `${latest.status || 'unknown'} · commit ${(latest.commit || '').slice(0,8) || '—'}`);
              } catch (e) { push('warn', 'PDF Pages 最新构建', shortErr(e.message, 160)); }
            }
          } catch (e) {
            push('bad', 'PDF Pages', `${shortErr(e.message, 160)}；若为 403，请给 PAT 增加 Pages: Read and write。`);
          }
        }
      }
    } catch (e) {
      push('bad', '自检异常', shortErr(e.message || e, 200));
    } finally {
      setChecks(out);
      setChecking(false);
    }
  }

  const cls = level => level === 'ok'
    ? 'bg-emerald-50 text-emerald-900 border-emerald-200'
    : level === 'bad'
      ? 'bg-rose-50 text-rose-900 border-rose-200'
      : 'bg-amber-50 text-amber-900 border-amber-200';
  const icon = level => level === 'ok' ? '✓' : level === 'bad' ? '✕' : '!';

  return (
    <div className="bg-white/5 rounded-2xl p-4 border border-white/10 lg:col-span-2">
      <div className="flex items-center justify-between gap-3 flex-wrap mb-3">
        <div>
          <div className="font-semibold">GitHub 配置向导与自检</div>
          <div className="text-xs text-white/60 mt-1">自检只执行读取请求，不创建文件、不触发 build；Pages 写权限会在上传发布或手动发布时实际验证。</div>
        </div>
        <button onClick={runChecks} disabled={checking} className={btnClass('primary', checking ? 'opacity-60' : '')}>
          {checking ? '检查中…' : '检查当前配置'}
        </button>
      </div>

      <div className="grid md:grid-cols-2 gap-4 text-sm">
        <div className="rounded-2xl bg-slate-950/30 border border-white/10 p-4">
          <div className="font-semibold mb-2">推荐配置步骤</div>
          <ol className="list-decimal pl-5 space-y-2 text-white/80 text-xs leading-5">
            <li>主仓库使用 <b>{cfg.owner}/{cfg.repo}</b>，分支设为 <b>{cfg.branch}</b>；确认 <code>{cfg.indexPath}</code> 所在路径正确。</li>
            <li>创建 Fine-grained PAT。Repository access 至少包含主仓库和 PDF 仓库；Repository permissions → <b>Contents: Read and write</b>，并设置 <b>Pages: Read and write</b>。</li>
            <li>PDF 分仓推荐先手动创建 <b>{pdfRepo}</b>。如果 PAT 只授权 Selected repositories，新建仓库后还要回到 token 设置把该仓库加入授权。</li>
            <li>PDF 仓库：Settings → Pages → Build and deployment → Source 选 <b>Deploy from a branch</b>，Branch 选 <b>{pdfBranch}</b>，目录选 <b>/(root)</b>。</li>
            <li>回到本页保存 PAT 和配置，再运行“检查当前配置”。主仓库、index.json、PDF 仓库、主仓 Pages、PDF Pages 均无红色错误后再上传。</li>
          </ol>
          <div className="flex gap-2 flex-wrap mt-3">
            <a href={tokenUrl} target="_blank" rel="noreferrer" className={btnClass('warn')}>创建 / 编辑 PAT</a>
            <a href={mainRepoUrl} target="_blank" rel="noreferrer" className={btnClass('slate')}>主仓库</a>
            <a href={mainPagesUrl} target="_blank" rel="noreferrer" className={btnClass('slate')}>主仓 Pages</a>
            <a href={pdfRepoUrl} target="_blank" rel="noreferrer" className={btnClass('slate')}>PDF 仓库</a>
            <a href={pdfPagesUrl} target="_blank" rel="noreferrer" className={btnClass('success')}>PDF Pages</a>
          </div>
        </div>

        <div className="rounded-2xl bg-slate-950/30 border border-white/10 p-4">
          <div className="font-semibold mb-2">常见错误对应关系</div>
          <div className="space-y-2 text-xs text-white/75 leading-5">
            <div><b>401</b>：PAT 无效、过期或粘贴错误。</div>
            <div><b>403</b>：仓库写入时通常是 Contents 无 Write；Pages build 请求时通常是 Pages 没有 Write。</div>
            <div><b>404</b>：仓库/文件确实不存在，或 fine-grained PAT 看不到该仓库。</div>
            <div><b>409</b>：index.json SHA 冲突；v3.2 继承 v3.1 机制：会丢弃旧 SHA，fresh GET 最新索引、重新 merge，并最多重试 4 次。</div>
            <div><b>422</b>：路径、SHA、分支或请求内容不符合 GitHub Contents API 要求。</div>
            <div><b>Pages 没有 run / 页面不更新</b>：v3.2 会主动 POST Pages build；若返回 403，请给 PAT 增加 Pages: Read and write。</div>
            <div><b>PDF 已上传但链接 404</b>：检查 PDF Pages 的 source branch 是否为 {pdfBranch}，并查看 v3.2 发布状态。</div>
          </div>
        </div>
      </div>

      {checks.length ? (
        <div className="mt-4 grid sm:grid-cols-2 lg:grid-cols-3 gap-2">
          {checks.map((c, i) => (
            <div key={i} className={cx('rounded-xl border p-3 text-xs', cls(c.level))}>
              <div className="font-semibold">{icon(c.level)} {c.name}</div>
              <div className="mt-1 leading-5">{c.detail}</div>
            </div>
          ))}
        </div>
      ) : null}
    </div>
  );
}

function ConfigPanel({ cfg, setCfg, token, setToken }) {
  const [localCfg, setLocalCfg] = useState(cfg);
  const [localToken, setLocalToken] = useState(token);

  const pdf = localCfg.pdf || {};
  const setPdf = (patch) => setLocalCfg({ ...localCfg, pdf: { ...(localCfg.pdf || {}), ...patch } });
  const pages = localCfg.pages || {};
  const setPages = (patch) => setLocalCfg({ ...localCfg, pages: { ...(localCfg.pages || {}), ...patch } });

  return (
    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div className="bg-white/5 rounded-2xl p-4 border border-white/10">
        <div className="font-semibold mb-3">主仓库设置（index.json 所在仓库）</div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <LabeledInput label="Owner" value={localCfg.owner} onChange={v => setLocalCfg({ ...localCfg, owner: v })} />

function MigrationPanel({ cfg, token, onMigrated }) {
  const [busy, setBusy] = useState(false);
  const [analysis, setAnalysis] = useState(null);
  const [msg, setMsg] = useState('');

  async function readCurrent() {
    if (!token) throw new Error('请先设置管理员 PAT。');
    const data = await ghGetJSONContent(cfg.owner, cfg.repo, cfg.indexPath, token, cfg.branch);
    if (!data) throw new Error(`未找到 ${cfg.indexPath}`);
    return normalizeIndexData(data);
  }

  async function analyze() {
    setBusy(true); setMsg('');
    try {
      const current = await readCurrent();
      const result = migrateIndexToV3(current, cfg);
      setAnalysis(result.report);
      setMsg(`分析完成：共 ${result.report.total} 条。这里只分析，不会改 GitHub。`);
    } catch (e) {
      setMsg('分析失败：' + (e.message || e));
    } finally { setBusy(false); }
  }

  async function migrate() {
    if (!token) return alert('请先设置管理员 PAT。');
    if (!confirm('执行 v3 数据迁移？程序会先在 index.json 同目录创建备份，再写入迁移后的索引。旧文件本体不会移动或删除。')) return;
    setBusy(true); setMsg('正在读取旧索引…');
    try {
      const current = await readCurrent();
      const result = migrateIndexToV3(current, cfg);
      const dir = indexDirOf(cfg.indexPath);
      const backupPath = `${dir ? dir + '/' : ''}backups/index-before-v3-${timestampForPath()}.json`;
      const backupBytes = new TextEncoder().encode(JSON.stringify(current, null, 2));
      const backupB64 = b64EncodeUint8(new Uint8Array(backupBytes));

      setMsg(`正在备份旧索引到 ${backupPath} …`);
      const backupMeta = await ghGetContentMeta(cfg.owner, cfg.repo, backupPath, token, cfg.branch);
      if (backupMeta) throw new Error(`备份路径已存在：${backupPath}。请重新执行以生成新时间戳。`);
      await ghPutContent(cfg.owner, cfg.repo, backupPath, backupB64, 'Backup index before Repo Library v3 migration', token, null, cfg.branch);

      setMsg('备份完成，正在写入 v3 索引…');
      const newData = await updateIndexMain(cfg, token, latest => {
        // 再对最新版本执行一次迁移，避免分析后到写入前 index 发生变化。
        return migrateIndexToV3(latest, cfg).data;
      }, 'Migrate Repo Library index to schema v3');

      setAnalysis(result.report);
      setMsg(`迁移完成。备份：${backupPath}。旧 PDF/文件仍保留原位置；相对路径条目已补充 storage 信息。`);
      onMigrated && onMigrated(newData);
    } catch (e) {
      console.error(e);
      setMsg('迁移失败：' + (e.message || e));
    } finally { setBusy(false); }
  }

  return (
    <section className="mb-6">
      <div className="bg-white rounded-3xl shadow-soft border border-slate-200 p-4">
        <div className="flex items-start justify-between gap-4 flex-wrap">
          <div>
            <div className="font-semibold text-slate-900">旧版本 → v3 数据迁移</div>
            <div className="text-xs text-slate-500 mt-1 max-w-3xl leading-5">
              迁移对象是主仓库里的 <code>{cfg.indexPath}</code>。程序会统一 id/topics/tags/timestamp/uploadStatus/storage 等字段；
              <b>不会移动、复制或删除旧 PDF/图片文件</b>，因此旧链接保持不变。执行迁移前会自动备份旧 index.json。
            </div>
          </div>
          <div className="flex gap-2 flex-wrap">
            <button onClick={analyze} disabled={busy} className={btnClass('slate', busy ? 'opacity-60' : '')}>只分析旧数据</button>
            <button onClick={migrate} disabled={busy} className={btnClass('warn', busy ? 'opacity-60' : '')}>备份并执行迁移</button>
          </div>
        </div>

        {analysis ? (
          <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-2 mt-4 text-xs">
            {[
              ['总条目', analysis.total],
              ['补 id', analysis.addedId],
              ['规范 Topics', analysis.normalizedTopics],
              ['规范 Tags', analysis.normalizedTags],
              ['补 storage', analysis.addedStorage],
              ['补上传状态', analysis.addedUploadStatus],
              ['缺文件路径', analysis.missingPath],
              ['缺时间', analysis.missingTime],
            ].map(([k,v]) => (
              <div key={k} className="rounded-xl border border-slate-200 bg-slate-50 p-3">
                <div className="text-slate-500">{k}</div>
                <div className="text-lg font-semibold text-slate-900 mt-1">{v}</div>
              </div>
            ))}
          </div>
        ) : null}
        {msg ? <div className="mt-3 text-sm text-slate-600 whitespace-pre-wrap">{msg}</div> : null}
      </div>
    </section>
  );
}

/* ============ v4.1 historical metadata backfill ============ */
function HistoricalMetadataPanel({ cfg, token, items, onCompleted }) {
  const candidates = useMemo(() => (items || []).filter(needsHistoricalMetadata), [items]);
  const [limit, setLimit] = useState(25);
  const [threshold, setThreshold] = useState(0.78);
  const [running, setRunning] = useState(false);
  const [writing, setWriting] = useState(false);
  const [progress, setProgress] = useState({ done: 0, total: 0, title: '' });
  const [results, setResults] = useState([]);
  const [selected, setSelected] = useState(() => new Set());
  const [scannedIds, setScannedIds] = useState(() => new Set());
  const [msg, setMsg] = useState('');
  const cancelRef = useRef(false);

  function toggle(id) {
    setSelected(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  }

  async function runScan() {
    if (running || !candidates.length) return;
    const unscanned = candidates.filter(item => !scannedIds.has(item.id));
    const source = unscanned.length ? unscanned : candidates;
    const batch = source.slice(0, Math.max(1, Math.min(200, Number(limit || 25))));
    setRunning(true); setResults([]); setSelected(new Set()); setMsg('');
    cancelRef.current = false;
    const collected = [];
    const autoIds = new Set();
    for (let i=0; i<batch.length; i++) {
      if (cancelRef.current) break;
      const item = batch[i];
      setProgress({ done: i, total: batch.length, title: makePaperLabel(item) });
      let result;
      try { result = await scanHistoricalItem(cfg, item, token, Number(threshold || 0.78)); }
      catch (e) { result = { itemId: item.id, originalTitle: makePaperLabel(item), status: 'error', confidence: 0, method: 'error', message: e.message || String(e), suggested: {} }; }
      collected.push(result);
      if (result.status === 'accepted') autoIds.add(result.itemId);
      setResults([...collected]);
      setSelected(new Set(autoIds));
      setProgress({ done: i+1, total: batch.length, title: makePaperLabel(item) });
      await new Promise(resolve => setTimeout(resolve, 220));
    }
    setRunning(false);
    setScannedIds(prev => new Set([...prev, ...collected.map(row=>row.itemId)]));
    const auto = collected.filter(x=>x.status==='accepted').length;
    const review = collected.filter(x=>x.status==='review').length;
    const failed = collected.length - auto - review;
    setMsg(`扫描完成：高可信 ${auto} 条，待人工复核 ${review} 条，未匹配/错误 ${failed} 条。默认只勾选高可信结果。`);
  }

  function exportReport() {
    const report = {
      schemaVersion: 1,
      generatedAt: new Date().toISOString(),
      threshold: Number(threshold || 0.78),
      total: results.length,
      results: results.map(r => ({
        itemId: r.itemId,
        originalTitle: r.originalTitle,
        status: r.status,
        confidence: r.confidence,
        method: r.method,
        stage: r.stage,
        matchedTitle: r.suggested?.title || '',
        doi: r.suggested?.doi || '',
        authors: (r.suggested?.authors || []).map(a=>a.name || a),
        message: r.message || ''
      }))
    };
    const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `metadata-review-${timestampForPath()}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }

  async function writeSelected() {
    if (!selected.size) return alert('请至少勾选一个结果。');
    if (!confirm(`将 ${selected.size} 条结果写入 index.json？写入前会自动备份。已有文章卡片不会被覆盖；缺少卡片的条目会从本次确认结果初始化一次。`)) return;
    setWriting(true); setMsg('正在备份当前索引…');
    try {
      const current = await ghGetJSONContent(cfg.owner, cfg.repo, cfg.indexPath, token, cfg.branch);
      if (!current) throw new Error(`未读取到 ${cfg.indexPath}`);
      const normalized = normalizeIndexData(current);
      const dir = indexDirOf(cfg.indexPath);
      const backupPath = `${dir ? dir + '/' : ''}backups/index-before-v5-backfill-${timestampForPath()}.json`;
      const backupBytes = new TextEncoder().encode(JSON.stringify(normalized, null, 2));
      await ghPutContent(cfg.owner, cfg.repo, backupPath, b64EncodeUint8(new Uint8Array(backupBytes)), 'Backup index before v5 metadata backfill', token, null, cfg.branch);

      const resultMap = new Map(results.filter(r=>selected.has(r.itemId)).map(r=>[r.itemId,r]));
      invalidateIndexWriteCache(cfg);
      const newData = await updateIndexMain(cfg, token, latest => ({
        ...latest,
        schemaVersion: Math.max(5, Number(latest.schemaVersion || 0)),
        appVersion: '5.2',
        paperCardSchemaVersion: 1,
        historicalMetadataUpdatedAt: Date.now(),
        items: (latest.items || []).map(item => {
          const result = resultMap.get(item.id);
          return result ? applyHistoricalSuggestion(item, result, result.status !== 'accepted') : item;
        })
      }), `Backfill ${selected.size} historical literature metadata records`);
      setMsg(`写入完成：${selected.size} 条。备份已保存到 ${backupPath}。低置信度条目只有在你手工勾选后才会写入。`);
      onCompleted?.(newData);
    } catch (e) {
      console.error(e);
      setMsg('写入失败：' + (e.message || String(e)));
    } finally { setWriting(false); }
  }

  const statusMeta = {
    accepted: ['高可信','bg-emerald-50 text-emerald-800 border-emerald-200'],
    review: ['待复核','bg-amber-50 text-amber-800 border-amber-200'],
    unmatched: ['未匹配','bg-slate-50 text-slate-700 border-slate-200'],
    error: ['错误','bg-rose-50 text-rose-800 border-rose-200']
  };

  return (
    <section className="mb-6">
      <div className="rounded-3xl border border-sky-200 bg-white p-4 shadow-soft">
        <div className="flex flex-wrap items-start justify-between gap-4">
          <div>
            <div className="font-semibold text-slate-900">🧭 v4.1 历史文献元数据补全</div>
            <div className="mt-1 max-w-3xl text-xs leading-5 text-slate-500">检测到 <b>{candidates.length}</b> 篇 PDF 的元数据不完整。系统先用现有 DOI/arXiv/题名匹配；不足时下载旧 PDF、解析前 3 页，再次匹配。扫描本身不修改 GitHub，只有最后勾选并确认才写入。</div>
          </div>
          <div className="flex flex-wrap items-end gap-2">
            <label className="text-xs text-slate-600">本批数量<input type="number" min="1" max="200" value={limit} onChange={e=>setLimit(e.target.value)} className="ml-2 w-20 rounded-xl border border-slate-300 px-2 py-2" /></label>
            <label className="text-xs text-slate-600">自动接受阈值<input type="number" min="0.5" max="1" step="0.01" value={threshold} onChange={e=>setThreshold(e.target.value)} className="ml-2 w-20 rounded-xl border border-slate-300 px-2 py-2" /></label>
            <button onClick={runScan} disabled={running || writing || !candidates.length} className={btnClass('primary', running||writing||!candidates.length?'opacity-60':'')}>{running?'扫描中…':`开始扫描（本轮剩余 ${Math.max(0,candidates.filter(x=>!scannedIds.has(x.id)).length)}）`}</button>
            {scannedIds.size && !running ? <button onClick={()=>setScannedIds(new Set())} className={btnClass('subtle')}>重置本轮</button> : null}
            {running ? <button onClick={()=>{cancelRef.current=true}} className={btnClass('danger')}>扫描完当前条后停止</button> : null}
          </div>
        </div>

        {running ? <div className="mt-4"><div className="mb-1 flex justify-between text-xs text-slate-500"><span className="truncate pr-4">{progress.title}</span><span>{progress.done}/{progress.total}</span></div><div className="h-2 overflow-hidden rounded-full bg-slate-100"><div className="h-full bg-sky-500 transition-all" style={{width:`${progress.total?progress.done/progress.total*100:0}%`}}></div></div></div> : null}

        {results.length ? (
          <div className="mt-4">
            <div className="mb-3 flex flex-wrap items-center gap-2"><button onClick={()=>setSelected(new Set(results.filter(r=>r.status==='accepted').map(r=>r.itemId)))} className={btnClass('success')}>只选高可信</button><button onClick={()=>setSelected(new Set(results.filter(r=>r.status==='accepted'||r.status==='review').map(r=>r.itemId)))} className={btnClass('warn')}>选择高可信 + 待复核</button><button onClick={exportReport} className={btnClass('slate')}>导出复核报告</button><button onClick={writeSelected} disabled={writing || running} className={btnClass('primary',writing||running?'opacity-60':'')}>{writing?'写入中…':`写入已选 ${selected.size} 条`}</button></div>
            <div className="max-h-[430px] overflow-auto rounded-2xl border border-slate-200">
              <table className="w-full min-w-[920px] text-left text-xs"><thead className="sticky top-0 bg-slate-100 text-slate-600"><tr><th className="p-3">写入</th><th className="p-3">状态</th><th className="p-3">原条目</th><th className="p-3">匹配结果</th><th className="p-3">方法 / 置信度</th><th className="p-3">识别信息</th></tr></thead><tbody className="divide-y divide-slate-200">{results.map(r=>{const meta=statusMeta[r.status]||statusMeta.error;return <tr key={r.itemId} className={selected.has(r.itemId)?'bg-sky-50/60':'bg-white'}><td className="p-3"><input type="checkbox" checked={selected.has(r.itemId)} disabled={r.status==='unmatched'||r.status==='error'} onChange={()=>toggle(r.itemId)} /></td><td className="p-3"><span className={cx('rounded-full border px-2 py-1',meta[1])}>{meta[0]}</span></td><td className="max-w-[240px] p-3"><div className="font-medium text-slate-900">{r.originalTitle}</div><div className="mt-1 text-slate-500">{r.stage==='pdf'?'已解析 PDF':'仅索引匹配'}</div></td><td className="max-w-[280px] p-3"><div className="font-medium text-slate-900">{r.suggested?.title||'—'}</div><div className="mt-1 text-slate-500">{r.suggested?.venue||''} {r.suggested?.year||''}</div></td><td className="p-3"><div>{r.method||'—'}</div><div className="mt-1 font-semibold text-sky-700">{Math.round(Number(r.confidence||0)*100)}%</div></td><td className="max-w-[260px] p-3"><div>{r.suggested?.doi?`DOI ${r.suggested.doi}`:'DOI 未识别'}</div><div className="mt-1 truncate text-slate-500">{(r.suggested?.authors||[]).slice(0,3).map(a=>a.name||a).join(', ')||r.message||'作者待补充'}</div></td></tr>})}</tbody></table>
            </div>
          </div>
        ) : null}
        {msg ? <div className="mt-3 whitespace-pre-wrap rounded-2xl bg-slate-50 p-3 text-sm text-slate-700">{msg}</div> : null}
        <div className="mt-3 text-xs leading-5 text-slate-500">安全规则：不覆盖顶层人工标题、Topics、标签、描述和团队字段；写入前自动备份；低于阈值的候选默认不勾选。若跨域策略阻止浏览器下载旧 PDF，请使用升级包中的 GitHub Actions“backfill”模式。</div>
      </div>
    </section>
  );
}

/* ============ Admin Panel ============ */
function AdminPanel({ cfg, token, onUploaded }) {
  const [files, setFiles] = useState([]);
  const [title, setTitle] = useState('');
  const [topicsInput, setTopicsInput] = useState('');
  const [tags, setTags] = useState('');
  const [desc, setDesc] = useState('');
  const [cover, setCover] = useState(null);
  const [autoMetadata, setAutoMetadata] = useState(true);

  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const [publishStates, setPublishStates] = useState({});
  const [publishingRepo, setPublishingRepo] = useState('');

  function setPublishState(repo, patch) {
    setPublishStates(prev => ({ ...prev, [repo]: { ...(prev[repo] || {}), ...patch, updatedAt: Date.now() } }));
  }

  async function runPagesPublish(owner, repo, branch, label) {
    const key = repo;
    setPublishingRepo(key);
    setPublishState(key, { status: 'checking', label, detail: '准备发布…' });
    try {
      const pagesCfg = cfg.pages || {};
      if (pagesCfg.waitForBuild === false) {
        const site = await ghGetPagesSite(owner, repo, token);
        if (!site) throw new Error(`${repo} 尚未启用 GitHub Pages。`);
        if (site?.source?.branch && site.source.branch !== branch) throw new Error(`Pages source=${site.source.branch}，但写入分支=${branch}。`);
        const head = await ghGetBranchHeadSha(owner, repo, branch, token);
        const req = await ghRequestPagesBuild(owner, repo, token);
        setPublishState(key, { status: req?.status || 'queued', label, detail: `已请求构建 ${head.slice(0,8)}；未等待完成。` });
        return { ok: true, status: req?.status || 'queued' };
      }
      return await publishPagesRepo({
        owner, repo, branch, token,
        timeoutMs: Math.max(30, Number(pagesCfg.timeoutSec || 180)) * 1000,
        pollMs: Math.max(2, Number(pagesCfg.pollSec || 3)) * 1000,
        onUpdate: x => setPublishState(key, { ...x, label })
      });
    } catch (e) {
      setPublishState(key, { status: 'failed', label, detail: e.message || String(e) });
      throw e;
    } finally {
      setPublishingRepo('');
    }
  }

  function handleSelect(e) { setFiles(Array.from(e.target.files || [])); }
  function handleCover(e) { setCover((e.target.files || [])[0] || null); }

  function resolvePdfRepoName(year) {
    const pdf = cfg.pdf || {};
    if (pdf.manualRepo && pdf.manualRepo.trim()) return pdf.manualRepo.trim();
    const prefix = pdf.repoPrefix || 'cheneit-pdf-';
    return `${prefix}${year}`;
  }

  function resolvePagesBase(owner, repo) {
    const pdf = cfg.pdf || {};
    // 如果设置了 pagesBase：直接用（可能想放在自定义域名下）
    if (pdf.pagesBase && pdf.pagesBase.trim()) {
      return pdf.pagesBase.replace(/\/+$/,'');
    }
    // 默认 Pages base：https://owner.github.io/repo
    return `https://${owner}.github.io/${repo}`;
  }

  async function uploadAll() {
    if (!token) { alert('请先在上方设置管理员令牌 (GitHub PAT)。'); return; }
    if (!files.length) { alert('请选择文件'); return; }

    setBusy(true);
    setMsg('');

    let successCount = 0;
    let failCount = 0;
    let lastIndexData = null;
    let mainTouched = false;
    const touchedPdfRepos = new Map();

    try {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');

      const baseDirMain = `${cfg.dataDir}/${y}/${m}`;
      const pdfCfg = cfg.pdf || {};
      const pdfEnabled = pdfCfg.enabled !== false;
      const pdfBranch = pdfCfg.branch || 'main';

      let ensuredPdfRepo = false;
      let pdfRepoName = null;

      const topicsArr = topicsInput ? topicsInput.split(',').map(s => s.trim()).filter(Boolean) : [];
      const tagsArr = tags ? tags.split(',').map(s => s.trim()).filter(Boolean) : [];

      let coverAttempted = false;
      let coverResult = { imagePath: '', error: '' };

      async function uploadCoverOnce() {
        if (!cover) return coverResult;
        if (coverAttempted) return coverResult;
        coverAttempted = true;
        try {
          setMsg(`正在上传封面：${cover.name}`);
          const imagePath = await uploadCoverIfNeeded(cfg, token, cover, '');
          coverResult = { imagePath, error: '' };
        } catch (e) {
          console.warn('封面上传失败，但条目和文件上传将继续', e);
          coverResult = { imagePath: '', error: e.message || String(e) };
        }
        return coverResult;
      }

      async function ensurePdfRepoOnce() {
        if (ensuredPdfRepo && pdfRepoName) return pdfRepoName;
        ensuredPdfRepo = true;
        pdfRepoName = resolvePdfRepoName(y);

        const test = await fetch(cacheBustUrl(`https://api.github.com/repos/${cfg.owner}/${pdfRepoName}`), {
          headers: ghHeaders(token),
          cache: 'no-store'
        });

        if (test.status === 404) {
          if (!pdfCfg.autoCreateRepo) {
            throw new Error(`PDF 仓库不存在：${pdfRepoName}。请先手动创建并开启 Pages。`);
          }
          setMsg(`检测到 PDF 仓库不存在，尝试自动创建：${pdfRepoName} ...`);
          try {
            await ghTryCreateRepo(pdfRepoName, token, { private: false });
            const nojekyllMeta = await ghGetContentMeta(cfg.owner, pdfRepoName, '.nojekyll', token, pdfBranch);
            await ghPutContent(cfg.owner, pdfRepoName, '.nojekyll', b64EncodeUint8(new Uint8Array([])), 'Add .nojekyll', token, nojekyllMeta?.sha, pdfBranch);

            const readme = new TextEncoder().encode(`# ${pdfRepoName}\n\nThis repo is used by Repo Library to store PDFs.\n\n- Enable GitHub Pages: Settings -> Pages -> Deploy from branch -> ${pdfBranch} / root\n`);
            const readmeB64 = b64EncodeUint8(new Uint8Array(readme));
            const readmeMeta = await ghGetContentMeta(cfg.owner, pdfRepoName, 'README.md', token, pdfBranch);
            await ghPutContent(cfg.owner, pdfRepoName, 'README.md', readmeB64, 'Init README for Pages', token, readmeMeta?.sha, pdfBranch);
          } catch (e) {
            throw new Error(`自动创建 PDF 仓库失败。请手动创建仓库 "${pdfRepoName}" 并给 token 授权 Contents: Read & Write，然后重试补传 PDF。原始错误：${e.message}`);
          }
        } else if (!test.ok) {
          const txt = await test.text();
          throw new Error(`检查 PDF 仓库失败：${test.status} ${test.statusText} - ${txt}`);
        }

        return pdfRepoName;
      }

      let i = 0;
      for (const file of files) {
        i += 1;

        const id = uid();
        const kind = guessKind(file.name);
        const ext = extOf(file.name);
        const isPdf = (kind === 'pdf' || ext === 'pdf');
        let metadataBundle = { scholarly: {}, citations: { count: 0, source: '', updatedAt: 0 } };
        if (autoMetadata && isPdf) {
          setMsg(`(${i}/${files.length}) 正在识别 PDF 元数据并匹配 OpenAlex：${file.name}`);
          try {
            metadataBundle = await buildMetadataForUpload(file);
          } catch (e) {
            console.warn('自动元数据识别失败，继续上传原文件', e);
            metadataBundle.scholarly = { metadataSource: 'PDF-local', metadataError: e.message || String(e), updatedAt: Date.now() };
          }
        }
        const cleanTitle = title || metadataBundle.scholarly?.title || file.name.replace(/\.[^/.]+$/, '');

        const initialItem = {
          id,
          title: cleanTitle,
          filename: file.name,
          path: '',
          kind: isPdf ? 'pdf' : kind,
          topics: topicsArr,
          topic: topicsArr[0] || '',
          tags: tagsArr,
          ts: Date.now(),
          createdTs: Date.now(),
          size: file.size,
          desc: desc || metadataBundle.scholarly?.abstract || '',
          imagePath: '',
          storage: null,
          uploadStatus: isPdf ? 'pdf_pending' : 'file_pending',
          uploadError: '',
          imageUploadError: '',
          groups: [],
          scholarly: metadataBundle.scholarly || {},
          citations: metadataBundle.citations || { count: 0, source: '', updatedAt: 0 }
        };
        initialItem.paperCard = buildPaperCardSnapshot(initialItem, initialItem.scholarly, 'upload-auto');
        if (desc) initialItem.paperCard.evaluation.shortReview = desc;

        setMsg(`(${i}/${files.length}) 正在先创建条目：${file.name}`);
        lastIndexData = await updateIndexMain(cfg, token, data => {
          const items = data.items || [];
          if (items.some(x => x.id === id)) return data;
          return { ...data, appVersion: '5.2', paperCardSchemaVersion: 1, items: [...items, initialItem] };
        }, `Create metadata item: ${file.name}`);
        mainTouched = true;
        onUploaded && onUploaded(lastIndexData);

        try {
          if (file.size > 95 * 1024 * 1024) {
            throw new Error(`文件过大（${humanSize(file.size)}）。GitHub 普通仓库单文件接近/超过 100 MB 时会失败，建议改用对象存储或先压缩 PDF。`);
          }
          if (file.size > 45 * 1024 * 1024) {
            setMsg(`(${i}/${files.length}) 文件较大（${humanSize(file.size)}），浏览器直传可能较慢：${file.name}`);
          }

          const coverInfo = await uploadCoverOnce();

          const buf = new Uint8Array(await file.arrayBuffer());
          const base64 = b64EncodeUint8(buf);

          let patch = {
            imagePath: coverInfo.imagePath || '',
            imageUploadError: coverInfo.error || '',
            uploadStatus: 'ready',
            uploadError: ''
          };

          if (isPdf && pdfEnabled) {
            const repoName = await ensurePdfRepoOnce();
            const storedFilename = `${id}.pdf`;
            const pdfDataDir = pdfCfg.dataDir || 'data/files';
            const baseDirPdf = `${pdfDataDir}/${y}/${m}`;
            const pathInPdfRepo = `${baseDirPdf}/${storedFilename}`;

            setMsg(`(${i}/${files.length}) 正在上传 PDF 到分仓 ${repoName}：${file.name}`);
            const meta = await ghGetContentMeta(cfg.owner, repoName, pathInPdfRepo, token, pdfBranch);
            await ghPutContent(cfg.owner, repoName, pathInPdfRepo, base64, `Upload ${file.name} via Repo Library (PDF storage)`, token, meta?.sha, pdfBranch);
            touchedPdfRepos.set(repoName, pdfBranch);

            const pagesBase = resolvePagesBase(cfg.owner, repoName);
            const pagesUrl = `${pagesBase}/${pathInPdfRepo}`;
            patch = {
              ...patch,
              path: pagesUrl,
              kind: 'pdf',
              storage: {
                owner: cfg.owner,
                repo: repoName,
                branch: pdfBranch,
                path: pathInPdfRepo
              }
            };
          } else {
            const storedFilename = isPdf ? `${id}.pdf` : `${id}__${file.name}`;
            const pathInMain = `${baseDirMain}/${storedFilename}`;

            setMsg(`(${i}/${files.length}) 正在上传文件到主仓库：${file.name}`);
            const meta = await ghGetContentMeta(cfg.owner, cfg.repo, pathInMain, token, cfg.branch);
            await ghPutContent(cfg.owner, cfg.repo, pathInMain, base64, `Upload ${file.name} via Repo Library`, token, meta?.sha, cfg.branch);

            patch = {
              ...patch,
              path: pathInMain,
              kind: isPdf ? 'pdf' : kind,
              storage: null
            };
          }

          successCount += 1;
          lastIndexData = await updateIndexMain(cfg, token, data => ({
            ...data,
            items: (data.items || []).map(x => x.id === id ? { ...x, ...patch, ts: Date.now() } : x)
          }), `Mark item ready: ${file.name}`);
          onUploaded && onUploaded(lastIndexData);

        } catch (e) {
          failCount += 1;
          console.error('文件上传失败，条目已保留', e);
          lastIndexData = await updateIndexMain(cfg, token, data => ({
            ...data,
            items: (data.items || []).map(x => x.id === id ? {
              ...x,
              imagePath: coverResult.imagePath || x.imagePath || '',
              imageUploadError: coverResult.error || x.imageUploadError || '',
              uploadStatus: 'upload_failed',
              uploadError: e.message || String(e),
              ts: Date.now()
            } : x)
          }), `Mark item upload failed: ${file.name}`);
          onUploaded && onUploaded(lastIndexData);
        }
      }

      const publishNotes = [];
      if ((cfg.pages?.autoBuild !== false) && token) {
        // 稳定发布顺序：先让 PDF Pages 上线，再发布主仓 Pages。
        for (const [repoName, branchName] of touchedPdfRepos.entries()) {
          try {
            setMsg(`文件提交完成；正在发布 PDF Pages：${repoName}…`);
            const result = await runPagesPublish(cfg.owner, repoName, branchName, 'PDF Pages');
            publishNotes.push(`${repoName}: ${result.status}`);
          } catch (e) {
            publishNotes.push(`${repoName}: failed (${shortErr(e.message, 90)})`);
          }
        }
        if (mainTouched) {
          try {
            setMsg('PDF 发布阶段完成；正在发布主仓 Pages…');
            const result = await runPagesPublish(cfg.owner, cfg.repo, cfg.branch, '主仓 Pages');
            publishNotes.push(`${cfg.repo}: ${result.status}`);
          } catch (e) {
            publishNotes.push(`${cfg.repo}: failed (${shortErr(e.message, 90)})`);
          }
        }
      } else if (mainTouched) {
        publishNotes.push('Pages 自动发布已关闭');
      }

      const publishText = publishNotes.length ? ` Pages：${publishNotes.join('；')}。` : '';
      setMsg(`上传流程完成：成功 ${successCount} 个，失败 ${failCount} 个。${publishText}${failCount ? ' 失败条目已保留，可后续补传。' : ''}`);
      setFiles([]); setTitle(''); setTopicsInput(''); setTags(''); setDesc(''); setCover(null);
      onUploaded && onUploaded(lastIndexData);

    } catch (e) {
      console.error(e);
      setMsg('出错：' + e.message);
    } finally {
      setBusy(false);
    }
  }

  const fileCount = files.length;
  const fileNames = fileCount ? files.map(f => f.name).join(', ') : '未选择文件';

  const pdfRepoHint = (() => {
    const y = new Date().getFullYear();
    const pdfRepoName = (cfg.pdf?.manualRepo && cfg.pdf.manualRepo.trim())
      ? cfg.pdf.manualRepo.trim()
      : `${cfg.pdf?.repoPrefix || 'cheneit-pdf-'}${y}`;
    return pdfRepoName;
  })();

  return (
    <section className="mb-6">
      <div className="bg-white rounded-3xl shadow-soft border border-slate-200 p-4 mb-4">
        <div className="flex items-center justify-between gap-3 flex-wrap mb-3">
          <div>
            <div className="font-semibold text-slate-900">🚀 Pages 发布控制（v3.2）</div>
            <div className="text-xs text-slate-500 mt-1">可手动触发；正常上传完成后会自动按“PDF Pages → 主仓 Pages”的顺序发布。</div>
          </div>
          <div className="flex gap-2 flex-wrap">
            <button disabled={busy || !!publishingRepo || !token} onClick={()=>runPagesPublish(cfg.owner, pdfRepoHint, cfg.pdf?.branch || 'main', 'PDF Pages').catch(()=>{})} className={btnClass('success', (busy || publishingRepo || !token) ? 'opacity-60' : '')}>发布 PDF Pages</button>
            <button disabled={busy || !!publishingRepo || !token} onClick={()=>runPagesPublish(cfg.owner, cfg.repo, cfg.branch, '主仓 Pages').catch(()=>{})} className={btnClass('primary', (busy || publishingRepo || !token) ? 'opacity-60' : '')}>发布主仓 Pages</button>
          </div>
        </div>
        <div className="grid md:grid-cols-2 gap-2">
          {[{repo: pdfRepoHint, label:'PDF Pages'}, {repo: cfg.repo, label:'主仓 Pages'}].map(x => {
            const st = publishStates[x.repo] || {};
            const ok = st.status === 'built';
            const bad = st.status === 'failed';
            return (
              <div key={x.repo} className={cx('rounded-xl border p-3 text-xs', ok ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : bad ? 'bg-rose-50 border-rose-200 text-rose-900' : 'bg-slate-50 border-slate-200 text-slate-700')}>
                <div className="font-semibold">{ok ? '✓' : bad ? '✕' : '•'} {x.label} · {x.repo}</div>
                <div className="mt-1">状态：{st.status || '未触发'}{publishingRepo === x.repo ? '（进行中）' : ''}</div>
                {st.detail ? <div className="mt-1 leading-5 break-words">{st.detail}</div> : null}
              </div>
            );
          })}
        </div>
      </div>

      <div className="bg-white rounded-3xl shadow-soft border border-slate-200 p-4">
        <div className="flex items-center justify-between mb-3 gap-3 flex-wrap">
          <div className="font-semibold text-slate-900">上传新条目</div>
          <div className="text-xs text-slate-500">
            非 PDF 自动存入：{cfg.dataDir}/YYYY/MM；PDF 默认分仓：<b>{pdfRepoHint}</b>
          </div>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div className="space-y-3">
            <label className="text-sm block">
              <div className="mb-1 text-slate-700">选择文件 (支持多选)</div>
              <input type="file" multiple onChange={handleSelect} className="block w-full text-sm" />
              <div className="mt-1 text-xs text-slate-500 truncate">当前: {fileNames}</div>
            </label>

            <label className="text-sm block">
              <div className="mb-1 text-slate-700">统一标题（可选，留空则用文件名）</div>
              <input value={title} onChange={e => setTitle(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white" />
            </label>

            <label className="text-sm block">
              <div className="mb-1 text-slate-700">Topics（逗号分隔，多 topic）</div>
              <input value={topicsInput} onChange={e => setTopicsInput(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white" />
            </label>

            <label className="text-sm block">
              <div className="mb-1 text-slate-700">标签（逗号分隔）</div>
              <input value={tags} onChange={e => setTags(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white" />
            </label>
          </div>

          <div className="space-y-3">
            <label className="text-sm block">
              <div className="mb-1 text-slate-700">条目简要描述</div>
              <textarea value={desc} onChange={e => setDesc(e.target.value)} rows={5} className="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white" />
            </label>

            <label className="text-sm block">
              <div className="mb-1 text-slate-700">封面图（可选，建议 16:9 或 4:3）</div>
              <input type="file" accept="image/*" onChange={handleCover} className="block w-full text-sm" />
            </label>

            <label className="flex items-start gap-3 rounded-2xl border border-sky-200 bg-sky-50 p-3 text-sm text-sky-950">
              <input type="checkbox" checked={autoMetadata} onChange={e=>setAutoMetadata(e.target.checked)} className="mt-1" />
              <span>
                <b>上传时自动提取学术元数据</b>
                <span className="block mt-1 text-xs text-sky-800">读取 PDF 前 3 页和内嵌信息，识别 DOI/arXiv，并从 OpenAlex（失败时 Crossref）补全作者、机构、期刊、发表日期、自动主题和引用数。识别失败不会阻断上传。</span>
              </span>
            </label>

            <div className="rounded-2xl border border-slate-200 bg-slate-50 p-3 text-xs text-slate-600">
              <div className="font-semibold text-slate-700 mb-1">提示</div>
              <ul className="list-disc pl-5 space-y-1">
                <li>新上传 PDF：会写入 <code>storage</code> 与 <code>scholarly</code> 字段；手工 Topics 与自动主题分开保存。</li>
                <li>PDF 仓库 Pages 必须使用 <b>Deploy from a branch</b>；v3.2 上传后会主动触发 build 并等待发布。</li>
                <li>PAT 除 Contents: Read &amp; Write 外，还需 <b>Pages: Read &amp; Write</b>；否则文件能上传，但主动发布会 403。</li>
                <li>如果你想把 PDF 集中进固定仓库：在「仓库设置 → PDF 分仓」填 <b>手动覆盖仓库名</b>。</li>
              </ul>
            </div>
          </div>
        </div>

        <div className="mt-4 flex items-center gap-3 flex-wrap">
          <button
            onClick={uploadAll}
            disabled={busy}
            className={btnClass('primary', busy ? 'opacity-60 cursor-not-allowed' : '')}
          >
            {busy ? '上传中…' : '上传所有文件'}
          </button>
          {msg ? <div className="text-sm text-slate-600">{msg}</div> : null}
        </div>
      </div>
    </section>
  );
}

/* ============ Dashboard ============ */
function Dashboard({ items, topicsCount, tagsCount, onPickTopic, onPickTag, onOpen, onSearch }) {
  const heat = useMemo(() => buildHeatmap(items, 365), [items]);
  const stats = useMemo(() => buildLiteratureStats(items), [items]);
  const [tab, setTab] = useState('overview');
  const [selectedTopic, setSelectedTopic] = useState('');
  const topicName = selectedTopic || stats.topics[0]?.name || '';
  const topic = stats.topics.find(x => x.name === topicName) || null;
  const topicStats = useMemo(() => buildLiteratureStats(topic?.papers || []), [topicName, items]);
  const maxYearCount = Math.max(1, ...(topic?.years || stats.years).map(x => x[1]));
  const citationList = (topic?.papers || items).slice().sort((a,b)=>citationOf(b).count-citationOf(a).count);
  const coveragePct = items.length ? Math.round(stats.coverage.scholarly / items.length * 100) : 0;
  const tabs = [
    ['overview','总览'], ['topic','Topic 动态'], ['people','人物 / 团队'],
    ['citations','引用排行'], ['relations','关联网络'], ['quality','数据质量']
  ];

  return (
    <section className="space-y-6">
      <div className="journal-rule border-x border-b border-[#d8d1c7] bg-white p-6">
        <div className="flex flex-wrap items-start justify-between gap-4">
          <div>
            <div className="smallcaps text-[#b3261e]">Literature intelligence</div>
            <h2 className="editorial-title mt-2 text-3xl font-semibold">科研文献情报台</h2>
            <p className="mt-2 max-w-2xl text-sm leading-6 text-[#625c54]">把 Topic、人物、机构、时间、引用与跨主题关系放入一份可追溯的研究档案。所有摘要行均可继续进入文章信息面板。</p>
          </div>
          <div className="border-l-2 border-[#b3261e] px-4 py-2 text-right">
            <div className="editorial-title text-3xl font-bold">{coveragePct}%</div>
            <div className="text-xs text-[#69635b]">学术元数据覆盖率</div>
          </div>
        </div>
        <div className="mt-5 grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-5">
          {[
            ['文献', items.length, '篇'], ['Topics', stats.topics.length, '个'],
            ['作者', stats.authors.length, '人'], ['机构 / 团队', stats.institutions.length, '个'],
            ['引用已同步', stats.coverage.citations, '篇']
          ].map(([label,value,unit]) => (
            <div key={label} className="border-t border-[#d8d1c7] p-3">
              <div className="smallcaps text-[#777067]">{label}</div>
              <div className="editorial-title mt-1 text-2xl font-bold">{value}<span className="ml-1 font-sans text-xs font-normal text-[#777067]">{unit}</span></div>
            </div>
          ))}
        </div>
      </div>

      <div className="bg-white border border-[#d8d1c7] overflow-hidden">
        <div className="flex gap-1 overflow-x-auto border-b border-[#d8d1c7] px-3 pt-2">
          {tabs.map(([key,label]) => (
            <button key={key} onClick={()=>setTab(key)} className={cx('whitespace-nowrap border-b-2 px-3 py-3 text-sm font-semibold', tab===key ? 'border-[#b3261e] text-[#171717]' : 'border-transparent text-[#69635b] hover:text-[#171717]')}>{label}</button>
          ))}
        </div>

        <div className="p-4">
          {tab === 'overview' ? (
            <div className="grid gap-5 xl:grid-cols-[1.25fr_.75fr]">
              <div>
                <div className="mb-3 flex items-center justify-between"><h3 className="font-semibold">Topic 活跃度</h3><span className="text-xs text-slate-500">按库内文章数排序</span></div>
                <div className="space-y-2">
                  {stats.topics.slice(0,10).map((row,i) => (
                    <button key={row.name} onClick={()=>{setSelectedTopic(row.name);setTab('topic')}} className="grid w-full grid-cols-[28px_1fr_auto] items-center gap-3 rounded-2xl border border-slate-200 p-3 text-left hover:border-sky-300 hover:bg-sky-50">
                      <span className="text-xs font-bold text-slate-400">{String(i+1).padStart(2,'0')}</span>
                      <span className="min-w-0"><span className="block truncate font-semibold text-slate-900">{row.name}</span><span className="block truncate text-xs text-slate-500">最近：{row.recent[0] ? makePaperLabel(row.recent[0]) : '—'}</span></span>
                      <span className="text-right"><span className="block font-bold text-slate-900">{row.count}</span><span className="text-[11px] text-slate-500">{row.citations} 引用</span></span>
                    </button>
                  ))}
                  {!stats.topics.length ? <div className="rounded-2xl bg-amber-50 p-4 text-sm text-amber-900">还没有手工 Topic。上传或编辑文献时至少添加一个 Topic，关联与趋势视图才会生效。</div> : null}
                </div>
              </div>
              <div className="space-y-5">
                <div>
                  <h3 className="mb-3 font-semibold">库内发表趋势</h3>
                  <MiniBarChart values={stats.years} maxValue={Math.max(1,...stats.years.map(x=>x[1]))} />
                </div>
                <div>
                  <h3 className="mb-3 font-semibold">常用标签</h3>
                  <div className="flex flex-wrap gap-2">{tagsCount.slice(0,12).map(([t,c])=><button key={t} onClick={()=>onPickTag(t)} className={btnClass('slate')}>#{t}<span className={badgeClass()}>{c}</span></button>)}</div>
                </div>
                <div className="rounded-2xl border border-slate-200 bg-slate-50 p-4 text-xs leading-5 text-slate-600"><b className="text-slate-800">口径：</b>“最近在做什么”按发表日期而非上传日期；引用来自 OpenAlex/Crossref。团队默认按 affiliation 聚合，实验室级归属建议在编辑页手工补充。</div>
              </div>
            </div>
          ) : null}

          {tab === 'topic' ? (
            <div>
              <div className="mb-5 flex flex-wrap items-center gap-3">
                <div><h3 className="font-semibold">Topic 近期动态</h3><p className="text-xs text-slate-500">看趋势、近期文章、活跃作者与机构</p></div>
                <select value={topicName} onChange={e=>setSelectedTopic(e.target.value)} className="ml-auto rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm">{stats.topics.map(x=><option key={x.name}>{x.name}</option>)}</select>
                {topicName ? <button onClick={()=>onPickTopic(topicName)} className={btnClass('primary')}>查看全部文章</button> : null}
              </div>
              {topic ? <div className="grid gap-5 lg:grid-cols-2">
                <div className="rounded-2xl border border-slate-200 p-4"><div className="mb-3 text-sm font-semibold">年度发表趋势</div><MiniBarChart values={topic.years} maxValue={maxYearCount} /></div>
                <div className="rounded-2xl border border-slate-200 p-4"><div className="mb-3 text-sm font-semibold">活跃作者 / 机构</div><RankRows rows={topicStats.authors.slice(0,5)} unit="篇" onPick={onSearch} /><div className="my-3 border-t border-slate-200"></div><RankRows rows={topicStats.institutions.slice(0,5)} unit="篇" empty="暂无机构信息" onPick={onSearch} /></div>
                <div className="lg:col-span-2 rounded-2xl border border-slate-200 p-4"><div className="mb-3 text-sm font-semibold">近期文献</div><PaperRows items={topic.recent.slice(0,8)} onOpen={onOpen} /></div>
              </div> : <div className="text-sm text-slate-500">请先为文献添加 Topic。</div>}
            </div>
          ) : null}

          {tab === 'people' ? (
            <div className="grid gap-5 lg:grid-cols-2">
              <RankTable title="作者在做什么" rows={stats.authors.slice(0,15)} onPick={onSearch} />
              <RankTable title="机构 / 团队在做什么" rows={stats.institutions.slice(0,15)} empty="暂无 affiliation 数据" onPick={onSearch} />
            </div>
          ) : null}

          {tab === 'citations' ? (
            <div>
              <div className="mb-4 flex flex-wrap items-center gap-3"><div><h3 className="font-semibold">Topic 引用排行</h3><p className="text-xs text-slate-500">OpenAlex 为主；日更脚本默认每天刷新一次</p></div><select value={topicName} onChange={e=>setSelectedTopic(e.target.value)} className="ml-auto rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm"><option value="">全部 Topic</option>{stats.topics.map(x=><option key={x.name}>{x.name}</option>)}</select></div>
              <div className="divide-y divide-[#ddd7ce] border border-[#d8d1c7]">{citationList.slice(0,30).map((p,i)=>{const c=citationOf(p);return <button type="button" onClick={()=>onOpen?.(p)} key={p.id||i} className="grid w-full grid-cols-[38px_1fr_auto] gap-3 p-3 text-left hover:bg-[#faf8f3]"><div className="text-center text-lg font-bold text-[#b7b0a6]">{i+1}</div><div className="min-w-0"><div className="truncate font-medium text-[#171717]">{makePaperLabel(p)}</div><div className="mt-1 text-xs text-[#69635b]">{authorsOf(p).slice(0,3).map(a=>a.name).join(', ') || '作者待补充'} · {publicationYearOf(p)||'年份待补充'} · {c.source||'未同步'}{isCitationStale(p)?' · 待更新':''}</div></div><div className="text-right"><div className="text-xl font-bold text-[#b3261e]">{c.count}</div><div className="text-[11px] text-[#69635b]">引用</div></div></button>})}</div>
            </div>
          ) : null}

          {tab === 'relations' ? (
            <div className="grid gap-5 lg:grid-cols-[.8fr_1.2fr]">
              <div><h3 className="mb-3 font-semibold">Topic 共现关系</h3><div className="space-y-2">{stats.links.slice(0,16).map(link=><button key={link.source+link.target} onClick={()=>{setSelectedTopic(link.source);setTab('topic')}} className="flex w-full items-center gap-2 rounded-2xl border border-slate-200 p-3 text-left hover:bg-slate-50"><span className="truncate text-sm font-medium">{link.source}</span><span className="text-slate-300">↔</span><span className="min-w-0 flex-1 truncate text-sm font-medium">{link.target}</span><span className={badgeClass()}>{link.count} 篇</span></button>)}</div>{!stats.links.length?<div className="text-sm text-slate-500">同一篇文献至少需要两个 Topic 才会形成关联。</div>:null}</div>
              <div><h3 className="mb-3 font-semibold">高关联文献</h3><PaperRows items={Array.from(new Map(stats.links.flatMap(x=>x.papers).map(p=>[p.id,p])).values()).slice(0,20)} onOpen={onOpen} /></div>
            </div>
          ) : null}

          {tab === 'quality' ? <DataQualityPanel items={items} coverage={stats.coverage} /> : null}
        </div>
      </div>

      <div className="bg-white rounded-3xl shadow-soft border border-slate-200 p-4">
        <div className="flex items-center gap-2 text-slate-900 font-semibold mb-3"><span className="text-lg">🗓️</span><span>上传日历</span><span className="ml-auto text-xs text-slate-500">最近 1 年</span></div>
        <Heatmap heat={heat} />
      </div>
    </section>
  );
}

function MiniBarChart({ values, maxValue=1 }) {
  if (!values?.length) return <div className="text-sm text-slate-500">暂无发表日期数据</div>;
  return <div className="flex h-40 items-end gap-2 overflow-x-auto border-b border-slate-200 px-1 pt-4">{values.map(([label,value])=><div key={label} className="flex min-w-[34px] flex-1 flex-col items-center justify-end gap-1"><span className="text-[11px] font-semibold text-slate-600">{value}</span><div className="w-full max-w-10 rounded-t-lg bg-gradient-to-t from-sky-700 to-cyan-400" style={{height:`${Math.max(8,Math.round(value/maxValue*105))}px`}}></div><span className="text-[10px] text-slate-500">{label}</span></div>)}</div>;
}

function RankRows({ rows, unit='篇', empty='暂无数据', onPick }) {
  if (!rows?.length) return <div className="text-xs text-slate-500">{empty}</div>;
  return <div className="space-y-1">{rows.map((r,i)=><button type="button" onClick={()=>onPick?.(r.name)} key={r.name} className="flex w-full items-center gap-3 p-1.5 text-left text-sm hover:bg-[#f6f3ec]"><span className="w-5 text-xs font-bold text-slate-400">{i+1}</span><span className="min-w-0 flex-1 truncate">{r.name}</span><span className="font-semibold">{r.count} {unit}</span></button>)}</div>;
}

function RankTable({ title, rows, empty='暂无数据', onPick }) {
  return <div className="border border-[#d8d1c7] bg-white p-4"><h3 className="editorial-title mb-3 text-xl">{title}</h3>{rows?.length?<div className="divide-y divide-[#ddd7ce]">{rows.map((r,i)=><button type="button" onClick={()=>onPick?.(r.name)} key={r.name} className="block w-full py-3 text-left hover:bg-[#faf8f3]"><div className="flex gap-3"><span className="text-xs font-bold text-[#aaa298]">{String(i+1).padStart(2,'0')}</span><span className="min-w-0 flex-1 truncate font-medium">{r.name}</span><span className="text-sm font-semibold">{r.count} 篇 · {r.citations} 引用</span></div><div className="ml-8 mt-1 truncate text-xs text-[#69635b]">{r.topTopics.map(([t,c])=>`${t} ${c}`).join(' · ') || 'Topic 待补充'}{r.latestYear?` · 最近 ${r.latestYear}`:''}</div></button>)}</div>:<div className="text-sm text-slate-500">{empty}</div>}</div>;
}

function PaperRows({ items, onOpen }) {
  if (!items?.length) return <div className="text-sm text-slate-500">暂无文献</div>;
  return <div className="divide-y divide-[#ddd7ce]">{items.map((p,i)=>{const card=paperCardOf(p);return <button type="button" onClick={()=>onOpen?.(p)} key={p.id||i} className="block w-full py-3 text-left hover:bg-[#faf8f3]"><div className="editorial-title text-[1.05rem] font-semibold text-[#171717]">{makePaperLabel(p)}</div><div className="mt-1 text-xs text-[#69635b]">{authorsOf(p).slice(0,4).map(a=>a.name).join(', ') || '作者待补充'} · {card.journal || paperCardStatusLabel(card.publicationStatus)} · {publicationYearOf(p)||'年份待补充'} · {citationOf(p).count} 引用</div><div className="mt-1 text-[11px] font-semibold text-[#b3261e]">打开文章面板 →</div></button>})}</div>;
}

function DataQualityPanel({ items, coverage }) {
  const checks = [
    ['尚未冻结文章卡片', items.filter(x=>!x.paperCard)],
    ['页面缺少 DOI', items.filter(x=>!paperCardOf(x).doi)],
    ['缺少作者', items.filter(x=>!authorsOf(x).length)],
    ['页面缺少年份', items.filter(x=>!paperCardOf(x).year)],
    ['尚未填写简短评价', items.filter(x=>!paperCardOf(x).evaluation?.shortReview)],
    ['缺少手工 Topic', items.filter(x=>!getTopicsArr(x).length)],
    ['引用待同步 / 已过期', items.filter(x=>isCitationStale(x))],
    ['元数据匹配需复核', items.filter(x=>scholarlyOf(x).metadataError || (scholarlyOf(x).matchConfidence && scholarlyOf(x).matchConfidence < 0.78 && !String(scholarlyOf(x).metadataReview?.status||'').startsWith('accepted')))],
    ['历史 PDF 扫描失败', items.filter(x=>scholarlyOf(x).backfillScan?.status==='error')]
  ];
  return <div><div className="mb-4"><h3 className="font-semibold">数据质量检查</h3><p className="text-xs text-slate-500">优先补文章卡片、DOI 与 Topic：它们分别决定页面可信度、自动匹配与知识组织口径。</p></div><div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">{checks.map(([label,list])=><div key={label} className={cx('rounded-2xl border p-4',list.length?'border-amber-200 bg-amber-50':'border-emerald-200 bg-emerald-50')}><div className="text-2xl font-bold">{list.length}</div><div className="text-sm font-semibold">{label}</div><div className="mt-1 truncate text-xs text-slate-500">{list.slice(0,3).map(makePaperLabel).join('、') || '状态良好'}</div></div>)}</div><div className="mt-4 rounded-2xl border border-slate-200 bg-slate-50 p-4 text-xs text-slate-600">文章卡片 {coverage.paperCards}/{items.length} · 外部元数据 {coverage.scholarly}/{items.length} · DOI {coverage.doi}/{items.length} · 作者 {coverage.authors}/{items.length} · 引用 {coverage.citations}/{items.length}</div></div>;
}

function Heatmap({ heat }) {
  const monthNames = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  const cell = 14;
  const gap = 4;
  const marks = new Map(heat.monthMarks.map(m => [m.week, m]));
  const rangeText = `${fmtDate(heat.rangeStart)} — ${fmtDate(heat.rangeEnd)}`;

  return (
    <div>
      <div className="flex items-center justify-between gap-3 mb-3 text-xs text-slate-500 flex-wrap">
        <span>周一 → 周日；每一列代表一个自然周</span>
        <span>{rangeText}</span>
      </div>
      <div className="overflow-auto scrollbar-thin">
        <div style={{ minWidth: 52 + heat.weeks.length * (cell + gap) }}>
          {/* 月份标签：与下方周列共享完全相同的列宽与 gap。 */}
          <div className="flex mb-2">
            <div style={{ width: 44, flex: '0 0 44px' }}></div>
            <div
              className="grid text-xs text-slate-500"
              style={{
                gridTemplateColumns: `repeat(${heat.weeks.length}, ${cell}px)`,
                columnGap: `${gap}px`,
                height: 18,
              }}
            >
              {heat.weeks.map((_, wi) => {
                const mark = marks.get(wi);
                return (
                  <div key={wi} className="relative overflow-visible">
                    {mark ? <span className="absolute left-0 top-0 whitespace-nowrap">{monthNames[mark.month]}</span> : null}
                  </div>
                );
              })}
            </div>
          </div>

          <div className="flex items-start">
            {/* 星期标签与热力图使用相同的 14px 行高 + 4px gap，不再靠 pt/空白 div 人工对齐。 */}
            <div
              className="grid text-xs text-slate-500 pr-2 text-right"
              style={{
                width: 44,
                flex: '0 0 44px',
                gridTemplateRows: `repeat(7, ${cell}px)`,
                rowGap: `${gap}px`,
              }}
            >
              {heat.weekdayLabels.map((label, i) => (
                <div key={i} className="leading-[14px]">{label}</div>
              ))}
            </div>

            <div
              className="grid"
              style={{
                gridTemplateColumns: `repeat(${heat.weeks.length}, ${cell}px)`,
                columnGap: `${gap}px`,
              }}
            >
              {heat.weeks.map((week, wi) => (
                <div
                  key={wi}
                  className="grid"
                  style={{ gridTemplateRows: `repeat(7, ${cell}px)`, rowGap: `${gap}px` }}
                >
                  {week.map((c, ri) => {
                    if (!c.inRange) {
                      return <div key={ri} style={{ width: cell, height: cell }} aria-hidden="true" />;
                    }
                    return (
                      <div
                        key={ri}
                        title={`${c.key}：${c.count} 篇`}
                        className={cx("rounded-sm border", intensityClass(c.count))}
                        style={{ width: cell, height: cell }}
                      />
                    );
                  })}
                </div>
              ))}
            </div>
          </div>

          <div className="flex items-center gap-2 mt-3 text-xs text-slate-500 pl-11">
            <span>少</span>
            <div className="w-3.5 h-3.5 rounded-sm border bg-slate-100 border-slate-200"></div>
            <div className="w-3.5 h-3.5 rounded-sm border bg-emerald-100 border-emerald-200"></div>
            <div className="w-3.5 h-3.5 rounded-sm border bg-emerald-200 border-emerald-300"></div>
            <div className="w-3.5 h-3.5 rounded-sm border bg-emerald-300 border-emerald-400"></div>
            <div className="w-3.5 h-3.5 rounded-sm border bg-emerald-400 border-emerald-500"></div>
            <span>多</span>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============ Preview Panel ============ */
function PreviewPanel({
  loading, error, items, totalAll,
  allTopics, allTags,
  activeTopic, setActiveTopic,
  activeTag, setActiveTag,
  sortBy, setSortBy,
  onOpen, cfg, mode,
  onEdit, onDeleted, onRepair,
  showFold, showAllHome, setShowAllHome
}) {
  function handleResetFilters() {
    setActiveTopic('');
    setActiveTag('');
    setSortBy('time_desc');
    setShowAllHome(false);
  }

  return (
    <section className="border border-[#d8d1c7] bg-white p-4">
      <div className="mb-5 flex flex-wrap items-center gap-3 border-b border-[#d8d1c7] pb-4">
        <div className="smallcaps mr-2 text-[#b3261e]">Article archive</div>
        <select value={activeTopic} onChange={(e) => setActiveTopic(e.target.value)} className="border border-[#cfc9bf] bg-white px-3 py-2 text-sm">
          <option value="">全部 Topic</option>
          {allTopics.map(t => <option key={t} value={t}>{t}</option>)}
        </select>

        <select value={activeTag} onChange={(e) => setActiveTag(e.target.value)} className="border border-[#cfc9bf] bg-white px-3 py-2 text-sm">
          <option value="">全部标签</option>
          {allTags.map(t => <option key={t} value={t}>{t}</option>)}
        </select>

        <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="border border-[#cfc9bf] bg-white px-3 py-2 text-sm">
          <option value="time_desc">按时间(新→旧)</option>
          <option value="time_asc">按时间(旧→新)</option>
          <option value="title_asc">标题(A→Z)</option>
          <option value="title_desc">标题(Z→A)</option>
          <option value="type">按类型</option>
          <option value="citations_desc">按引用数(高→低)</option>
          <option value="publication_desc">按发表时间(新→旧)</option>
        </select>

        <button type="button" onClick={handleResetFilters} className={btnClass('slate')}>
          重置筛选
        </button>

        <span className="ml-auto text-sm text-slate-500">
          显示 {items.length} / 共 {totalAll} 条
        </span>
      </div>

      {loading ? <div className="text-slate-600">加载中…</div> : null}
      {error ? <div className="text-rose-600">{error}</div> : null}

      <div className="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
        {items.map(item => (
          <Card
            key={item.id}
            cfg={cfg}
            item={item}
            canAdmin={mode === 'admin'}
            onOpen={() => onOpen(item)}
            onEdit={() => onEdit && onEdit(item)}
            onDelete={() => onDeleted && onDeleted(item)}
            onRepair={() => onRepair && onRepair(item)}
          />
        ))}
      </div>

      {/* 首页折叠按钮 */}
      {showFold && totalAll > 6 ? (
        <div className="mt-5 flex justify-center">
          <button
            onClick={() => setShowAllHome(!showAllHome)}
            className={btnClass('subtle')}
          >
            {showAllHome ? '折叠（只看最近6条）' : `展开更多（还有 ${totalAll - 6} 条）`}
          </button>
        </div>
      ) : null}

      {!loading && !totalAll ? (
        <div className="text-sm text-slate-500 mt-6">没有符合条件的条目。</div>
      ) : null}
    </section>
  );
}

/* ============ Card ============ */
function Card({ cfg, item, onOpen, onEdit, onDelete, onRepair, canAdmin }) {
  const [copied, setCopied] = useState(false);
  const card = paperCardOf(item);
  const topicsArr = getTopicsArr(item);
  const status = uploadStatusMeta(item);
  const citation = citationOf(item);
  const rawHref = itemRawHref(cfg, item);
  const pdfHref = itemPdfHref(cfg, item);
  const coverSrc = item.imagePath ? buildRawUrl(cfg, item.imagePath) : '';
  const authors = card.authors || [];
  const affiliations = card.affiliations || [];
  const evaluation = card.evaluation?.shortReview || '';
  const sourceLine = card.publicationStatus === 'preprint'
    ? `Preprint · arXiv${card.arxivId ? ` ${card.arxivId}` : ''}`
    : [card.journal || paperCardStatusLabel(card.publicationStatus), card.year].filter(Boolean).join(' · ');

  async function copyBib(e) {
    e.stopPropagation();
    await copyText(formatBibtex(item));
    setCopied(true); setTimeout(()=>setCopied(false), 1600);
  }

  return (
    <article onClick={onOpen} className="paper-card flex h-full min-h-[500px] cursor-pointer flex-col border border-[#d8d1c7] bg-[#fffefa]">
      <div className="relative h-44 w-full overflow-hidden border-b border-[#d8d1c7] bg-[#ede8df]">
        {coverSrc ? (
          <img src={coverSrc} alt="文章示意图" className="h-full w-full object-cover" />
        ) : (
          <div className="paper-grid flex h-full flex-col justify-between p-5">
            <div className="smallcaps text-[#b3261e]">Research figure</div>
            <div>
              <div className="editorial-title text-3xl text-[#9a9389]">{String(topicsArr[0] || 'R').slice(0,1).toUpperCase()}</div>
              <div className="mt-1 max-w-[85%] text-xs leading-5 text-[#6f685f]">{topicsArr[0] || 'Illustration pending · 可在管理模式上传示意图片'}</div>
            </div>
          </div>
        )}
        <span className="absolute left-0 top-0 bg-[#b3261e] px-3 py-1.5 text-[10px] font-bold uppercase tracking-[.15em] text-white">{paperCardStatusLabel(card.publicationStatus)}</span>
      </div>

      <div className="flex flex-1 flex-col p-5">
        <div className="smallcaps text-[#b3261e]">{sourceLine || 'Source pending'}</div>
        <h3 className="editorial-title mt-2 line-clamp-3 text-[1.35rem] font-semibold leading-[1.18] text-[#171717]">{card.title || item.filename}</h3>
        <div className="mt-3 text-sm leading-5 text-[#3e3a35]">{authors.slice(0,4).join(', ') || '作者待补充'}{authors.length > 4 ? ` et al.` : ''}</div>
        {affiliations.length ? <div className="mt-1 line-clamp-2 text-xs leading-5 text-[#777067]">{affiliations.slice(0,3).join(' · ')}</div> : null}

        <div className="mt-4 flex items-center gap-3 border-y border-[#ddd7ce] py-2 text-xs text-[#625c54]">
          <span>{card.year || 'Year —'}</span>
          <span className="h-3 border-l border-[#c6bfb5]"></span>
          <span className="font-semibold text-[#b3261e]">{citation.count} citations</span>
          {isCitationStale(item) ? <span className="ml-auto text-amber-700">待更新</span> : <span className="ml-auto text-[#777067]">已同步</span>}
        </div>

        {evaluation ? (
          <blockquote className="mt-4 border-l-2 border-[#b3261e] pl-3 text-sm italic leading-6 text-[#514c45]">“{evaluation}”</blockquote>
        ) : item.desc ? (
          <div className="mt-4 line-clamp-3 text-sm leading-6 text-[#69635b]">{item.desc}</div>
        ) : (
          <div className="mt-4 text-sm text-[#91897f]">尚未填写简短评价。</div>
        )}

        {topicsArr.length ? (
          <div className="mt-4 flex flex-wrap gap-x-3 gap-y-1">
            {topicsArr.slice(0,4).map(t => <span key={t} className="text-xs font-semibold text-[#4d5945]">#{t}</span>)}
          </div>
        ) : null}

        {status ? (
          <div className={cx("mt-3 inline-flex w-fit border px-2 py-1 text-[11px]", status.cls)} title={item.uploadError || ''}>{status.label}</div>
        ) : null}

        {item.uploadError || item.imageUploadError ? (
          <div className="mt-3 border border-amber-200 bg-amber-50 p-2 text-xs text-amber-900">{shortErr(item.uploadError || item.imageUploadError)}</div>
        ) : null}

        <div className="mt-auto flex flex-wrap items-center gap-2 border-t border-[#171717] pt-4" onClick={e=>e.stopPropagation()}>
          <button onClick={onOpen} className={btnClass('primary')}>文章面板</button>
          {(item.path || card.links?.pdf) ? <a href={pdfHref} target="_blank" rel="noreferrer" className={btnClass('slate')}>PDF</a> : null}
          <button onClick={copyBib} className={btnClass('slate')}>{copied ? '已复制' : 'BibTeX'}</button>
          {canAdmin ? (
            <div className="ml-auto flex flex-wrap items-center gap-2">
              {isRepairablePdfItem(item) ? <button onClick={onRepair} className={btnClass('success')}>修复</button> : null}
              <button onClick={onEdit} className={btnClass('warn')}>编辑</button>
              <button onClick={onDelete} className={btnClass('danger')}>删除</button>
            </div>
          ) : null}
        </div>
      </div>
    </article>
  );
}

/* ============ Viewer Modal ============ */
function ViewerModalLegacy({ cfg, item, onClose, onReplace, mode }) {
  const [tab, setTab] = useState(item.kind === 'pdf' ? 'pdf' : 'text'); // pdf|html|text
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  const [text, setText] = useState('');
  const scrollRef = useRef(null);

  const topicsArr = getTopicsArr(item);

  // raw for download
  const rawHref = (() => {
    if (item.storage?.owner && item.storage?.repo && item.storage?.path) {
      const branch = item.storage.branch || (cfg.pdf?.branch || 'main');
      return ghRawUrl({ owner: item.storage.owner, repo: item.storage.repo, branch, path: item.storage.path });
    }
    return buildRawUrl(cfg, item.path);
  })();

  // pdf direct open
  const pdfHref = buildPdfBrowserUrl(item.path);

  useEffect(() => {
    async function load() {
      setErr('');
      setText('');

      // PDF 直接 iframe，不需要拉 text
      if (tab === 'pdf') return;
      if (!item.path) {
        setErr('文件尚未上传成功；当前只保留了条目文字信息。');
        return;
      }

      setLoading(true);
      try {
        const url = rawHref;
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        const t = await res.text();
        setText(t);
        setTimeout(() => { try { window.hljs && window.hljs.highlightAll(); } catch {} }, 50);
      } catch (e) {
        setErr(e.message);
      } finally {
        setLoading(false);
      }
    }
    load();
  }, [tab, item.id]);

  const language = guessHighlightLanguage(item.filename || '');

  return (
    <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white rounded-3xl max-w-5xl w-full border border-slate-200 shadow-2xl overflow-hidden" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between px-4 py-3 border-b border-slate-200 gap-3 flex-wrap">
          <div className="min-w-0">
            <div className="font-semibold truncate">{item.title || item.filename}</div>
            <div className="text-xs text-slate-500">
              {FILE_KINDS[item.kind]?.label || 'FILE'} · {fmtDate(item.ts)}{topicsArr[0] ? ` · ${topicsArr[0]}` : ''}
            </div>
            {authorsOf(item).length ? <div className="mt-1 max-w-2xl truncate text-xs text-sky-700">{authorsOf(item).map(a=>a.name).join(', ')} · {scholarlyOf(item).venue || '来源待补充'} · {publicationYearOf(item)||'年份待补充'} · {citationOf(item).count} 引用</div> : null}
          </div>
          <div className="flex items-center gap-2 flex-wrap justify-end">
            {item.kind === 'pdf' ? (
              <button className={btnClass(tab==='pdf' ? 'success' : 'slate')} onClick={()=>setTab('pdf')}>PDF</button>
            ) : null}
            <button className={btnClass(tab==='html' ? 'primary' : 'slate')} onClick={()=>setTab('html')}>
              {item.kind === 'html' ? 'HTML' : 'Raw'}
            </button>
            <button className={btnClass(tab==='text' ? 'primary' : 'slate')} onClick={()=>setTab('text')}>
              {item.kind === 'code' ? 'Code' : 'Text'}
            </button>
            <a className={btnClass('slate')} href={rawHref} target="_blank" rel="noreferrer">Raw</a>

            {mode === 'admin' && item.kind === 'pdf' ? (
              <button className={btnClass('warn')} onClick={onReplace} title="上传注释版并覆盖原文件（链接不变）">
                替换PDF
              </button>
            ) : null}

            <button className={btnClass('danger')} onClick={onClose}>关闭</button>
          </div>
        </div>

        <div ref={scrollRef} className="p-0 max-h-[75vh] overflow-auto relative">
          {tab === 'pdf' ? (
            item.path ? (
              <iframe
                className="w-full h-[75vh] bg-white"
                src={pdfHref}
                title={item.title || item.filename}
              />
            ) : (
              <div className="p-6 text-slate-700">
                <div className="font-semibold mb-2">文件尚未上传成功</div>
                <div className="text-sm text-slate-600">该条目的文字信息已经保留在 index.json 中，可在管理模式中使用“替换PDF”补传文件。</div>
                {item.uploadError ? <div className="mt-3 text-xs text-rose-700 bg-rose-50 border border-rose-200 rounded-2xl p-3">{item.uploadError}</div> : null}
              </div>
            )
          ) : loading ? (
            <div className="p-6 text-slate-600">加载中…</div>
          ) : err ? (
            <div className="p-6 text-rose-600">{err}</div>
          ) : tab === 'html' && item.kind === 'html' ? (
            <iframe
              className="w-full h-[75vh] bg-white"
              srcDoc={text}
              sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
              title={item.title || item.filename}
            />
          ) : (
            <pre className="p-4 text-sm bg-[#0b1020] text-slate-50 overflow-auto">
              <code className={language ? `language-${language}` : ''}>{text}</code>
            </pre>
          )}

          {tab !== 'pdf' && !loading && !err ? (
            <button
              onClick={() => scrollRef.current && scrollRef.current.scrollTo({ top: 0, behavior: 'smooth' })}
              className="absolute right-4 bottom-4 px-3 py-1.5 rounded-full bg-slate-900 text-xs text-white shadow-lg hover:bg-slate-800"
            >
              回到顶部
            </button>
          ) : null}
        </div>
      </div>
    </div>
  );
}

/* ============ v5 article information panel ============ */
