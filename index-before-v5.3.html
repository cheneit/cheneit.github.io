                  <MetadataRow label="DOI">{card.doi}</MetadataRow>
                  <MetadataRow label="arXiv">{card.arxivId}</MetadataRow>
                  <MetadataRow label="Citations"><span className="font-bold text-[#b3261e]">{citation.count}</span> <span className="text-xs text-[#777067]">{citation.source || 'not synced'}{isCitationStale(item)?' · stale':''}</span></MetadataRow>
                  <MetadataRow label="Reading">{({unread:'未读',reading:'在读',read:'已读',revisit:'需重读'})[card.evaluation?.readingStatus] || card.evaluation?.readingStatus}</MetadataRow>
                </dl>

                <div className="mt-7 flex items-center justify-between gap-3"><div className="smallcaps text-[#b3261e]">BibTeX</div><button onClick={copyBib} className={btnClass('slate')}>{copied ? '已复制' : '复制 BibTeX'}</button></div>
                <pre className="mt-3 max-h-72 overflow-auto whitespace-pre-wrap border border-[#cfc9bf] bg-white p-4 text-[11px] leading-5 text-[#302d29]">{bibtex}</pre>
                <p className="mt-2 text-[11px] leading-5 text-[#777067]">BibTeX 每次由本页显示字段即时生成，不读取或覆盖一份独立的隐藏引用记录。</p>
              </aside>
            </div>
          ) : tab === 'pdf' ? (
            (item.path || card.links?.pdf) ? <iframe className="h-[78vh] w-full bg-white" src={pdfHref} title={card.title || item.filename} /> : <div className="p-8 text-[#625c54]">PDF 尚未上传或链接未填写。</div>
          ) : loading ? (
            <div className="p-8 text-[#625c54]">加载中…</div>
          ) : err ? (
            <div className="p-8 text-rose-700">{err}</div>
          ) : (
            <pre className="min-h-[60vh] overflow-auto bg-[#111] p-5 text-sm text-slate-50"><code className={language ? `language-${language}` : ''}>{text}</code></pre>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============ Edit Modal ============ */
function EditItemModalLegacy({ item, onClose, onSave }) {
  const initialTopicsArr = getTopicsArr(item);
  const [title, setTitle] = useState(item.title || '');
  const [topicsInput, setTopicsInput] = useState(initialTopicsArr.join(', '));
  const [tagsInput, setTagsInput] = useState((item.tags || []).join(', '));
  const [groupsInput, setGroupsInput] = useState((item.groups || []).join('; '));
  const [desc, setDesc] = useState(item.desc || '');
  const [cover, setCover] = useState(null);
  const [scholarly, setScholarly] = useState(() => ({ ...scholarlyOf(item) }));
  const [authorsInput, setAuthorsInput] = useState(authorsOf(item).map(a=>a.name).join('; '));
  const [institutionsInput, setInstitutionsInput] = useState(institutionsOf(item).map(x=>x.name).join('; '));
  const [citationCount, setCitationCount] = useState(String(citationOf(item).count || 0));
  const [resolving, setResolving] = useState(false);
  const [metadataMsg, setMetadataMsg] = useState('');

  async function refreshMetadata() {
    setResolving(true); setMetadataMsg('');
    try {
      const resolved = await resolveScholarlyMetadata({ title, doi: scholarly.doi, arxivId: scholarly.arxivId });
      setScholarly(prev => ({ ...prev, ...resolved }));
      if (resolved.title) setTitle(resolved.title);
      if (resolved.abstract && !desc) setDesc(resolved.abstract);
      setAuthorsInput((resolved.authors || []).map(a=>a.name).join('; '));
      setInstitutionsInput((resolved.institutions || []).map(x=>x.name).join('; '));
      setCitationCount(String(resolved.citations?.count || 0));
      setMetadataMsg(resolved.metadataError ? resolved.metadataError : `已从 ${resolved.metadataSource || '学术数据库'} 刷新`);
    } catch (e) { setMetadataMsg('刷新失败：' + (e.message || String(e))); }
    finally { setResolving(false); }
  }

  function handleSubmit() {
    const topicsArr = topicsInput ? topicsInput.split(',').map(s => s.trim()).filter(Boolean) : [];
    const tagsArr = tagsInput ? tagsInput.split(',').map(s => s.trim()).filter(Boolean) : [];
    const groupsArr = groupsInput ? groupsInput.split(/[;；]/).map(s=>s.trim()).filter(Boolean) : [];
    const authorNames = authorsInput ? authorsInput.split(/[;；\n]/).map(s=>s.trim()).filter(Boolean) : [];
    const institutionNames = institutionsInput ? institutionsInput.split(/[;；\n]/).map(s=>s.trim()).filter(Boolean) : [];
    const structuredAuthors = authorNames.map(name => scholarly.authors?.find(a=>a.name===name) || { name });
    const structuredInstitutions = institutionNames.map(name => scholarly.institutions?.find(x=>x.name===name) || { name });
    const citations = { ...citationOf(item), ...(scholarly.citations || {}), count: Math.max(0, Number(citationCount || 0)), updatedAt: scholarly.citations?.updatedAt || citationOf(item).updatedAt };

    const updated = {
      ...item,
      title,
      desc,
      topics: topicsArr,
      topic: topicsArr[0] || '',
      tags: tagsArr,
      groups: groupsArr,
      scholarly: { ...scholarly, authors: structuredAuthors, institutions: structuredInstitutions, citations },
      citations
    };
    onSave && onSave(updated, cover);
  }

  return (
    <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white rounded-3xl max-w-5xl w-full border border-slate-200 shadow-2xl overflow-hidden" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between px-4 py-3 border-b border-slate-200">
          <div className="font-semibold">编辑条目信息</div>
          <button onClick={onClose} className={btnClass('danger')}>关闭</button>
        </div>

        <div className="max-h-[75vh] overflow-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-4">
          <div className="space-y-3">
            <label className="text-sm block">
              <div className="mb-1 text-slate-700">标题</div>
              <input value={title} onChange={e=>setTitle(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm" />
            </label>

            <label className="text-sm block">
              <div className="mb-1 text-slate-700">Topics（逗号分隔）</div>
              <input value={topicsInput} onChange={e=>setTopicsInput(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm" />
            </label>

            <label className="text-sm block">
              <div className="mb-1 text-slate-700">标签（逗号分隔）</div>
              <input value={tagsInput} onChange={e=>setTagsInput(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm" />
            </label>

            <label className="text-sm block">
              <div className="mb-1 text-slate-700">团队 / 实验室（分号分隔，手工校正）</div>
              <input value={groupsInput} onChange={e=>setGroupsInput(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm" placeholder="例如：A 教授课题组; Quantum Transport Lab" />
            </label>
          </div>

          <div className="space-y-3">
            <label className="text-sm block">
              <div className="mb-1 text-slate-700">描述</div>
              <textarea value={desc} onChange={e=>setDesc(e.target.value)} rows={6} className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm" />
            </label>

            <label className="text-sm block">
              <div className="mb-1 text-slate-700">替换封面（可选）</div>
              <input type="file" accept="image/*" onChange={e=>setCover((e.target.files||[])[0]||null)} className="block w-full text-sm" />
            </label>
          </div>

          <div className="space-y-3 rounded-2xl border border-sky-200 bg-sky-50 p-3">
            <div className="flex items-center justify-between gap-2"><div className="text-sm font-semibold text-sky-950">学术元数据</div><button type="button" disabled={resolving} onClick={refreshMetadata} className={btnClass('primary', resolving?'opacity-60':'')}>{resolving?'匹配中…':'自动刷新'}</button></div>
            <label className="text-xs block"><div className="mb-1 text-slate-700">DOI</div><input value={scholarly.doi||''} onChange={e=>setScholarly({...scholarly,doi:cleanDoi(e.target.value)})} className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm" /></label>
            <label className="text-xs block"><div className="mb-1 text-slate-700">arXiv ID</div><input value={scholarly.arxivId||''} onChange={e=>setScholarly({...scholarly,arxivId:e.target.value})} className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm" /></label>
            <label className="text-xs block"><div className="mb-1 text-slate-700">作者（分号分隔）</div><textarea rows={2} value={authorsInput} onChange={e=>setAuthorsInput(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm" /></label>
            <label className="text-xs block"><div className="mb-1 text-slate-700">机构（分号分隔）</div><textarea rows={2} value={institutionsInput} onChange={e=>setInstitutionsInput(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm" /></label>
            <div className="grid grid-cols-2 gap-2">
              <label className="text-xs block"><div className="mb-1 text-slate-700">期刊 / 来源</div><input value={scholarly.venue||''} onChange={e=>setScholarly({...scholarly,venue:e.target.value})} className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm" /></label>
              <label className="text-xs block"><div className="mb-1 text-slate-700">发表日期</div><input type="date" value={scholarly.publicationDate||''} onChange={e=>setScholarly({...scholarly,publicationDate:e.target.value,year:Number(e.target.value.slice(0,4))||null})} className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm" /></label>
            </div>
            <label className="text-xs block"><div className="mb-1 text-slate-700">引用数</div><input type="number" min="0" value={citationCount} onChange={e=>setCitationCount(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-sm" /></label>
            {metadataMsg ? <div className="rounded-xl bg-white p-2 text-xs leading-5 text-slate-600">{metadataMsg}</div> : null}
          </div>
        </div>

        <div className="px-4 py-3 border-t border-slate-200 flex items-center justify-end gap-2">
          <button onClick={onClose} className={btnClass('slate')}>取消</button>
          <button onClick={handleSubmit} className={btnClass('success')}>保存</button>
        </div>
      </div>
    </div>
  );
}

/* ============ v5 paper-card editor ============ */
function EditItemModal({ item, onClose, onSave }) {
  const initialCard = paperCardOf(item);
  const [card, setCard] = useState(() => ({ ...initialCard, links: {...initialCard.links}, evaluation: {...initialCard.evaluation} }));
  const [authorsInput, setAuthorsInput] = useState((initialCard.authors || []).join('; '));
  const [affiliationsInput, setAffiliationsInput] = useState((initialCard.affiliations || []).join('; '));
  const [topicsInput, setTopicsInput] = useState(getTopicsArr(item).join(', '));
  const [tagsInput, setTagsInput] = useState((item.tags || []).join(', '));
  const [groupsInput, setGroupsInput] = useState((item.groups || []).join('; '));
  const [desc, setDesc] = useState(item.desc || '');
  const [cover, setCover] = useState(null);
  const [scholarly, setScholarly] = useState(() => ({ ...scholarlyOf(item) }));
  const [citationCount, setCitationCount] = useState(String(citationOf(item).count || 0));
  const [resolving, setResolving] = useState(false);
  const [metadataMsg, setMetadataMsg] = useState('');

  const inputCls = 'w-full border border-[#cfc9bf] bg-white px-3 py-2 text-sm focus:border-[#b3261e] focus:outline-none';
  const Label = ({ title, hint, children }) => <label className="block text-sm"><div className="mb-1 font-semibold text-[#514c45]">{title}</div>{children}{hint ? <div className="mt-1 text-[11px] leading-5 text-[#777067]">{hint}</div> : null}</label>;
  const setField = (name, value) => setCard(prev => ({ ...prev, [name]: value }));
  const setLink = (name, value) => setCard(prev => ({ ...prev, links: { ...prev.links, [name]: value } }));
  const setEvaluation = (name, value) => setCard(prev => ({ ...prev, evaluation: { ...prev.evaluation, [name]: value } }));

  function normalizedCard() {
    const authors = textList(authorsInput);
    const affiliations = textList(affiliationsInput);
    const doi = cleanDoi(card.doi);
    const arxivId = String(card.arxivId || '').trim();
    const next = {
      ...card,
      schemaVersion: 1,
      frozenAt: card.frozenAt || Date.now(),
      updatedAt: Date.now(),
      source: 'manual',
      title: String(card.title || '').trim(),
      authors,
      affiliations,
      year: Number(card.year || 0) || null,
      doi,
      arxivId,
      citationKey: String(card.citationKey || '').trim(),
      links: {
        ...card.links,
        doi: doi ? `https://doi.org/${doi}` : '',
        arxiv: arxivId ? `https://arxiv.org/abs/${arxivId}` : ''
      },
      evaluation: { ...card.evaluation }
    };
    if (!next.citationKey) next.citationKey = citationKeyFromCard(next);
    return next;
  }

  async function refreshMetadata() {
    setResolving(true); setMetadataMsg('');
    try {
      const resolved = await resolveScholarlyMetadata({ title: card.title, doi: scholarly.doi || card.doi, arxivId: scholarly.arxivId || card.arxivId });
      setScholarly(prev => ({ ...prev, ...resolved }));
      setCitationCount(String(resolved.citations?.count || citationCount || 0));
      setMetadataMsg(resolved.metadataError || `外部参考已从 ${resolved.metadataSource || '学术数据库'} 更新；文章卡片没有被改动。`);
    } catch (e) { setMetadataMsg('刷新失败：' + (e.message || String(e))); }
    finally { setResolving(false); }
  }

  function copyFromScholarly() {
    if (!confirm('把当前外部学术元数据复制到文章卡片？这一步是显式人工操作，会替换题名、作者、单位、来源和出版字段，但保留你的短评、阅读状态与自定义链接。')) return;
    const snapshot = buildPaperCardSnapshot({ ...item, title: card.title }, scholarly, 'manual-sync');
    const next = {
      ...snapshot,
      frozenAt: card.frozenAt || snapshot.frozenAt,
      evaluation: { ...card.evaluation },
      links: { ...snapshot.links, ...card.links, doi: snapshot.links.doi || card.links?.doi || '', arxiv: snapshot.links.arxiv || card.links?.arxiv || '', publisher: snapshot.links.publisher || card.links?.publisher || '' },
      citationKey: card.citationKey || snapshot.citationKey,
      source: 'manual-sync'
    };
    setCard(next); setAuthorsInput(next.authors.join('; ')); setAffiliationsInput(next.affiliations.join('; '));
    setMetadataMsg('已复制到编辑表单；点击“保存文章卡片”后才会写入 GitHub。');
  }

  function handleSubmit() {
    const finalCard = normalizedCard();
    const topics = String(topicsInput || '').split(/[,，]/).map(x=>x.trim()).filter(Boolean);
    const tags = String(tagsInput || '').split(/[,，]/).map(x=>x.trim()).filter(Boolean);
    const groups = textList(groupsInput);
    const citations = { ...citationOf(item), ...(scholarly.citations || {}), count: Math.max(0, Number(citationCount || 0)), updatedAt: scholarly.citations?.updatedAt || citationOf(item).updatedAt };
    onSave?.({
      ...item,
      title: finalCard.title || item.title,
      desc,
      topics,
      topic: topics[0] || '',
      tags,
      groups,
      paperCard: finalCard,
      scholarly: { ...scholarly, citations },
      citations
    }, cover);
  }

  const previewItem = { ...item, paperCard: { ...card, authors: textList(authorsInput), affiliations: textList(affiliationsInput), year: Number(card.year || 0) || null } };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-[#171717]/75 p-3 backdrop-blur-sm" onClick={onClose}>
      <div className="journal-rule w-full max-w-7xl overflow-hidden border-x border-b border-[#bdb6ab] bg-[#fffefa] shadow-2xl" onClick={e=>e.stopPropagation()}>
        <div className="flex flex-wrap items-center justify-between gap-3 border-b border-[#d8d1c7] px-5 py-4">
          <div><div className="smallcaps text-[#b3261e]">Editorial maintenance</div><h2 className="editorial-title mt-1 text-2xl">编辑文章卡片</h2></div>
          <div className="flex gap-2"><button onClick={onClose} className={btnClass('slate')}>取消</button><button onClick={handleSubmit} className={btnClass('primary')}>保存文章卡片</button></div>
        </div>

        <div className="max-h-[82vh] overflow-auto p-5 sm:p-6">
          <div className="mb-6 border-l-4 border-[#b3261e] bg-[#f7f4ee] p-4 text-sm leading-6 text-[#514c45]">
            这里的字段决定卡片、详情页与 BibTeX。保存后由你维护；“自动刷新”只更新右侧外部参考与引用数，不会覆盖本表单。只有点击“复制到卡片”才会显式采用外部结果。
          </div>

          <div className="grid gap-6 xl:grid-cols-[1.2fr_.8fr]">
            <div className="space-y-6">
              <section className="border border-[#d8d1c7] bg-white p-5">

                <div className="grid gap-4">
                  <Label title="页面题名"><textarea rows={3} value={card.title || ''} onChange={e=>setField('title',e.target.value)} className={inputCls+' editorial-title text-xl'} /></Label>
                  <div className="grid gap-4 md:grid-cols-2">
                    <Label title="作者" hint="每位作者用分号或换行分隔"><textarea rows={4} value={authorsInput} onChange={e=>setAuthorsInput(e.target.value)} className={inputCls} /></Label>
                    <Label title="单位 / Affiliations" hint="每个单位用分号或换行分隔"><textarea rows={4} value={affiliationsInput} onChange={e=>setAffiliationsInput(e.target.value)} className={inputCls} /></Label>

                <div className="flex flex-wrap items-start justify-between gap-3"><div><div className="smallcaps text-[#b3261e]">External scholarly reference</div><div className="mt-1 text-xs leading-5 text-[#69635b]">独立于文章卡片，仅供比对和引用数刷新。</div></div><button disabled={resolving} onClick={refreshMetadata} className={btnClass('slate',resolving?'opacity-50':'')}>{resolving?'匹配中…':'自动刷新参考'}</button></div>
                <dl className="mt-4 space-y-2 text-xs text-[#514c45]"><div><b>识别题名：</b>{scholarly.title || '—'}</div><div><b>来源：</b>{scholarly.venue || '—'} · {scholarly.year || '—'}</div><div><b>DOI：</b>{scholarly.doi || '—'}</div><div><b>arXiv：</b>{scholarly.arxivId || '—'}</div><div><b>作者：</b>{textList(scholarly.authors || []).slice(0,5).join(', ') || '—'}</div></dl>
                <div className="mt-4 grid grid-cols-[1fr_auto] gap-2"><input type="number" min="0" value={citationCount} onChange={e=>setCitationCount(e.target.value)} className={inputCls} aria-label="引用数" /><span className="self-center text-xs text-[#69635b]">引用数</span></div>
                <button onClick={copyFromScholarly} className={btnClass('warn','mt-4 w-full')}>明确复制到文章卡片</button>
                {metadataMsg ? <div className="mt-3 border-l-2 border-[#b3261e] pl-3 text-xs leading-5 text-[#625c54]">{metadataMsg}</div> : null}
              </section>

              <section className="border border-[#d8d1c7] bg-white p-5">
                <div className="smallcaps text-[#b3261e]">BibTeX generated from page</div>
                <div className="mt-4 grid gap-4 sm:grid-cols-2">
                  <Label title="Citation key"><input value={card.citationKey || ''} onChange={e=>setField('citationKey',e.target.value)} className={inputCls} /></Label>
                  <Label title="Entry type"><select value={card.bibtexEntryType || 'article'} onChange={e=>setField('bibtexEntryType',e.target.value)} className={inputCls}><option value="article">article</option><option value="misc">misc</option><option value="inproceedings">inproceedings</option><option value="book">book</option></select></Label>
                </div>
                <pre className="mt-4 max-h-80 overflow-auto whitespace-pre-wrap border border-[#cfc9bf] bg-[#f7f4ee] p-4 text-[11px] leading-5">{formatBibtex(previewItem)}</pre>
              </section>
            </div>
          </div>

          <div className="mt-6 flex justify-end gap-2 border-t border-[#d8d1c7] pt-5"><button onClick={onClose} className={btnClass('slate')}>取消</button><button onClick={handleSubmit} className={btnClass('primary')}>保存文章卡片</button></div>
        </div>
      </div>
    </div>
  );
}

/* ============ Replace PDF Modal ============ */
function ReplacePdfModal({ item, onClose, onReplace }) {
  const [file, setFile] = useState(null);

  return (
    <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white rounded-3xl max-w-xl w-full border border-slate-200 shadow-2xl overflow-hidden" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between px-4 py-3 border-b border-slate-200">
          <div className="font-semibold">替换 PDF（覆盖原文件，链接不变）</div>
          <button onClick={onClose} className={btnClass('danger')}>关闭</button>
        </div>

        <div className="p-4 space-y-3">
          <div className="text-sm text-slate-700">
            当前条目：<b>{item.title || item.filename}</b>
          </div>
          <div className="text-xs text-slate-500">
            适用于你对 PDF 做注释后，用新版本覆盖原 PDF；网页链接保持不变。
          </div>

          <label className="text-sm block">
            <div className="mb-1 text-slate-700">选择新的 PDF 文件</div>
            <input type="file" accept="application/pdf" onChange={e=>setFile((e.target.files||[])[0]||null)} className="block w-full text-sm" />
          </label>

          <div className="rounded-2xl border border-slate-200 bg-slate-50 p-3 text-xs text-slate-600">
            <div className="font-semibold text-slate-700 mb-1">注意</div>
            <ul className="list-disc pl-5 space-y-1">
              <li>若该条目是新上传 PDF（带 storage），会自动覆盖分仓内真实文件。</li>
              <li>若是旧条目且 path 为相对路径，会在主仓库覆盖对应文件。</li>
              <li>若是旧条目且 path 为绝对 URL 但没有 storage，系统无法定位仓库路径。</li>
            </ul>
          </div>
        </div>

        <div className="px-4 py-3 border-t border-slate-200 flex items-center justify-end gap-2">
          <button onClick={onClose} className={btnClass('slate')}>取消</button>
          <button onClick={()=>onReplace(file)} disabled={!file} className={btnClass('warn', !file ? 'opacity-60 cursor-not-allowed' : '')}>
            覆盖替换
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============ Archive Sidebar (timeline style B) ============ */
function ArchiveSidebar({ items, onOpen }) {
  const sorted = useMemo(() => [...items].sort((a,b)=>(b.ts||0)-(a.ts||0)), [items]);
  const recent3 = sorted.slice(0, 3);

  // group by year->month
  const groups = useMemo(() => {
    const g = new Map(); // year -> Map(month -> items)
    for (const it of sorted) {
      const d = new Date(it.ts || 0);
      if (isNaN(d)) continue;
      const y = d.getFullYear();
      const m = d.getMonth() + 1;
      if (!g.has(y)) g.set(y, new Map());
      const gm = g.get(y);
      if (!gm.has(m)) gm.set(m, []);
      gm.get(m).push(it);
    }
    // sort inside each month
    for (const [y, gm] of g.entries()) {
      for (const [m, arr] of gm.entries()) {
        arr.sort((a,b)=>(b.ts||0)-(a.ts||0));
      }
    }
    return g;
  }, [sorted]);

  const years = useMemo(() => Array.from(groups.keys()).sort((a,b)=>b-a), [groups]);

  return (
    <aside className="journal-rule border-x border-b border-[#d8d1c7] bg-[#fffefa] p-4">
      <div className="flex items-center justify-between mb-3">
        <div><div className="smallcaps text-[#b3261e]">Chronology</div><div className="editorial-title mt-1 text-xl font-semibold">时间归档</div></div>
        <div className="text-xs text-slate-500">最近 {items.length} 条</div>
      </div>

      {/* recent 3 */}
      <div className="mb-4">
        <div className="text-xs font-semibold text-slate-700 mb-2">最近 3 篇</div>
        <div className="space-y-2">
          {recent3.map(it => (
            <button
              key={it.id}
              onClick={()=>onOpen(it)}
              className="w-full border-t border-[#d8d1c7] p-3 text-left hover:bg-[#f7f4ee]"
            >
              <div className="text-sm font-semibold text-slate-900 line-clamp-1">{it.title || it.filename}</div>
              <div className="text-xs text-slate-500 mt-0.5">{fmtDate(it.ts)} · {(getTopicsArr(it)[0] || '—')}</div>
            </button>
          ))}
          {!recent3.length ? <div className="text-sm text-slate-500">暂无条目</div> : null}
        </div>
      </div>

      <div className="border-t border-slate-200 pt-4">
        <div className="text-xs font-semibold text-slate-700 mb-2">时间轴（下滑查看更多）</div>

        <div className="max-h-[520px] overflow-auto scrollbar-thin pr-2">
          <div className="tl">
            {years.map(year => {
              const monthsMap = groups.get(year);
              const months = Array.from(monthsMap.keys()).sort((a,b)=>b-a);
              return (
                <div key={year} className="mb-5 relative">
                  <div className="tl-dot" style={{ top: 2 }}></div>
                  <div className="pl-4">
                    <div className="text-base font-semibold text-slate-900">{year}</div>
                    <div className="mt-2 space-y-3">
                      {months.map(month => {
                        const arr = monthsMap.get(month) || [];
                        return (
                          <div key={month} className="relative">
                            <div className="tl-dot sm" style={{ top: 6 }}></div>
                            <div className="pl-4">
                              <div className="text-sm font-semibold text-slate-800">{String(month).padStart(2,'0')}</div>
                              <div className="mt-1 space-y-1">
                                {arr.slice(0, 6).map(it => (
                                  <button
                                    key={it.id}
                                    onClick={()=>onOpen(it)}
                                    className="w-full text-left text-sm text-slate-700 hover:text-slate-900 hover:underline line-clamp-1"
                                    title={it.title || it.filename}
                                  >
                                    {String(new Date(it.ts||0).getDate()).padStart(2,'0')} · {it.title || it.filename}
                                  </button>
                                ))}
                                {arr.length > 6 ? (
                                  <div className="text-xs text-slate-400">… 还有 {arr.length - 6} 条</div>
                                ) : null}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </aside>
  );
}
