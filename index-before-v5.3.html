<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

/**
 * =========================
 * Research Library — 单文件 SPA（v5.2 B5 文献书导出版）
 * - Preview：浏览 / 搜索 / 筛选 / Dashboard（统计、日历、归档）
 * - Admin：上传 / 编辑 / 删除 / 替换PDF（注释后覆盖）
 *
 * 关键改动：
 * 1) A 方案：PDF 分仓（默认 prefix + 年份，例如 cheneit-pdf-2026）
 * 2) 新上传 PDF：index.json 新条目增加 storage 字段（旧条目不改结构）
 * 3) 首页仅显示最近 6 条，其余折叠
 * 4) Tags / Topics 统计（圆圈 badge），词云 + 日历热力图
 * 5) 右侧归档栏（时间轴式），默认强调最近 3 篇 + 下滑更多
 * 6) 按钮统一：浅色背景 + 深色字体，不同功能不同背景色
 * 7) v2：metadata-first 上传、index 写回重试、branch 显式写入、错误状态保留
 * 8) v3.3：页面未认证时不挂载 App、不读取 index；浏览器认证持久化；PAT 保持浏览器本地隔离
 * 9) v4.0：上传时提取 DOI/arXiv/PDF 元数据，并用 OpenAlex/Crossref 补全作者、机构、期刊、主题和引用数
 * 10) v4.0：新增 Topic 趋势、作者/机构画像、引用排行、Topic 关联网络和元数据质量面板
 * 11) v4.0：兼容 v3 index.json；自动元数据使用 scholarly/citations 新字段，不覆盖人工 topics/tags
 * 12) v4.1：历史 PDF 批量扫描、分级置信度、人工复核、写入前自动备份与复核报告
 * 13) v5：上传时冻结 paperCard；后续自动任务只更新 scholarly/citations，不覆盖人工字段
 * 14) v5：可点击文献情报、文章信息面板、页面字段驱动的 BibTeX 与编辑式短评
 * 15) v5.1：站点标题作为 Home 链接；按 B5 书页导出文献卡片、Topic 分析与批注页
 * 16) v5.2：文献书示意图移至作者/单位之后，并以约 1/5 可打印页高的通栏画框展示
 * =========================
 */

/* ============ v3.3 全站访问保护 ============ */
// 重要：这是纯前端访问门槛，适合阻止普通访问者直接看到页面；它不是服务端身份认证。
// 如果需要真正让仓库数据/PDF 在网络层不可公开，需要 private storage + 服务端/OAuth/Cloudflare Access 等方案。
const PASSWORD_HASH = '4f40ff9d23ac703fcfd831af98492f6973662cc75248ec6b1bd8f37eaaf2b1e9';
const AUTH_KEY = 'repoLibrary.authed';
const AUTH_MARKER = `sha256:${PASSWORD_HASH}`;

async function sha256Hex(str) {
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function hasPersistentPageAuth() {
  try { return localStorage.getItem(AUTH_KEY) === AUTH_MARKER; }
  catch { return false; }
}

function rememberPageAuth() {
  try { localStorage.setItem(AUTH_KEY, AUTH_MARKER); } catch {}
}

function forgetPageAuth() {
  try { localStorage.removeItem(AUTH_KEY); } catch {}
}

function PrivateAccessGate({ onUnlocked }) {
  const [password, setPassword] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');
  const inputRef = useRef(null);

  useEffect(() => { inputRef.current?.focus(); }, []);

  async function submit(e) {
    e?.preventDefault?.();
    if (!password || busy) return;
    setBusy(true);
    setError('');
    try {
      const hash = await sha256Hex(password);
      if (hash !== PASSWORD_HASH) {
        setPassword('');
        setError('密码不正确。');
        setTimeout(() => inputRef.current?.focus(), 0);
        return;
      }
      rememberPageAuth();
      onUnlocked?.();
    } catch (err) {
      setError('无法完成本地密码校验：' + (err?.message || String(err)));
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="min-h-full bg-slate-950 text-white flex items-center justify-center px-4">
      <div className="w-full max-w-md rounded-3xl border border-white/10 bg-slate-900 shadow-2xl p-6 sm:p-8">
        <div className="w-12 h-12 rounded-2xl bg-slate-800 flex items-center justify-center text-2xl mb-5">🔒</div>
        <div className="smallcaps text-[#b3261e]">Private research archive</div>
        <div className="editorial-title mt-2 text-3xl font-semibold">Research Library</div>
        <div className="mt-2 text-sm text-slate-400 leading-6">
          这是私有页面。此浏览器验证成功后会记住授权；新的浏览器或清除站点数据后需要重新验证。
        </div>

        <form onSubmit={submit} className="mt-6 space-y-3">
          <label className="block text-sm">
            <div className="mb-1.5 text-slate-300">访问密码</div>
            <input
              ref={inputRef}
              type="password"
              autoComplete="current-password"
              value={password}
              onChange={e => setPassword(e.target.value)}
              className="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-sky-500"
              placeholder="请输入访问密码"
            />
          </label>
          {error ? <div className="text-sm text-rose-300">{error}</div> : null}
          <button
            type="submit"
            disabled={!password || busy}
            className="w-full px-4 py-3 rounded-xl bg-white text-slate-950 font-medium hover:bg-slate-100 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            {busy ? '验证中…' : '进入 Research Library'}
          </button>
        </form>

        <div className="mt-5 text-xs text-slate-500 leading-5">
          页面密码与 GitHub PAT 相互独立。PAT 不会随页面认证在不同浏览器之间同步。
        </div>
      </div>
    </div>
  );
}

function PrivateRoot() {
  const [authed, setAuthed] = useState(() => hasPersistentPageAuth());

  function lockPage() {
    forgetPageAuth();
    setAuthed(false);
  }

  if (!authed) return <PrivateAccessGate onUnlocked={() => setAuthed(true)} />;
  return <App onLockPage={lockPage} />;
}

/* ============ UI helpers ============ */
function cx(...arr){ return arr.filter(Boolean).join(' '); }

function btnClass(variant='slate', extra='') {
  const base = "inline-flex items-center justify-center gap-2 px-3 py-2 rounded-sm text-sm font-semibold border transition-colors";
  const map = {
    primary: "bg-[#b3261e] text-white border-[#b3261e] hover:bg-[#8f1f19]",
    success: "bg-[#eef2e8] text-[#31543a] border-[#bdc9b8] hover:bg-[#e4eadc]",
    warn:    "bg-amber-50 text-amber-900 border-amber-200 hover:bg-amber-100",
    danger:  "bg-rose-50 text-rose-800 border-rose-200 hover:bg-rose-100",
    slate:   "bg-white text-[#24211d] border-[#cfc9bf] hover:bg-[#f2eee7]",
    subtle:  "bg-[#f6f3ec] text-[#514c45] border-[#d8d1c7] hover:bg-[#ece7de]",
    dark:    "bg-[#171717] text-white border-[#171717] hover:bg-[#333]",
  };
  return cx(base, map[variant] || map.slate, extra);
}

function badgeClass() {
  return "ml-2 inline-flex items-center justify-center min-w-[22px] h-[22px] px-1.5 rounded-full bg-rose-500 text-white text-xs font-semibold";
}

function uploadStatusMeta(item) {
  const s = item?.uploadStatus || '';
  if (!s || s === 'ready') return null;
  const map = {
    metadata_created: { label: '条目已创建，文件待上传', cls: 'bg-amber-50 text-amber-800 border-amber-200' },
    file_pending:     { label: '文件待上传', cls: 'bg-amber-50 text-amber-800 border-amber-200' },
    pdf_pending:      { label: 'PDF 待上传', cls: 'bg-amber-50 text-amber-800 border-amber-200' },
    upload_failed:    { label: '文件上传失败，条目已保留', cls: 'bg-rose-50 text-rose-800 border-rose-200' },
    partial_ready:     { label: '部分完成', cls: 'bg-amber-50 text-amber-800 border-amber-200' },
  };
  return map[s] || { label: s, cls: 'bg-slate-50 text-slate-700 border-slate-200' };
}

function shortErr(err, n=140) {
  if (!err) return '';
  const s = String(err).replace(/\s+/g, ' ').trim();
  return s.length > n ? s.slice(0, n) + '…' : s;
}

function humanSize(bytes) {
  const n = Number(bytes || 0);
  if (!n) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB'];
  let v = n, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i += 1; }
  return `${v.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
}

/* ============ v4.1 scholarly metadata helpers ============ */
function cleanDoi(value) {
  return String(value || '')
    .trim()
    .replace(/^https?:\/\/(dx\.)?doi\.org\//i, '')
    .replace(/^doi:\s*/i, '')
    .replace(/[\s\]\[{}<>"']+$/g, '')
    .replace(/[.,;:]+$/g, '');
}

function extractDoi(text) {
  const m = String(text || '').match(/10\.\d{4,9}\/[-._;()/:A-Z0-9]+/i);
  return m ? cleanDoi(m[0]) : '';
}

function extractArxivId(text) {
  const s = String(text || '');
  const modern = s.match(/(?:arXiv\s*[:/]?\s*)?(\d{4}\.\d{4,5})(?:v\d+)?/i);
  if (modern) return modern[1];
  const legacy = s.match(/(?:arXiv\s*[:/]?\s*)?([a-z-]+\/\d{7})(?:v\d+)?/i);
  return legacy ? legacy[1] : '';
}

function normalizeTitleForMatch(value) {
  return String(value || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
}

function titleSimilarity(a, b) {
  const aa = new Set(normalizeTitleForMatch(a).split(/\s+/).filter(x => x.length > 2));
  const bb = new Set(normalizeTitleForMatch(b).split(/\s+/).filter(x => x.length > 2));
  if (!aa.size || !bb.size) return 0;
  let hit = 0;
  aa.forEach(x => { if (bb.has(x)) hit += 1; });
  return hit / Math.max(aa.size, bb.size);
}

function looksGenericPaperTitle(value) {
  const s = String(value || '').trim();
  if (!s || s.length < 8) return true;
  if (/^(paper|article|document|untitled|manuscript|download|fulltext|main|supp|si|sm)[-_\s\d.]*$/i.test(s)) return true;
  if (/^[a-f0-9_-]{12,}$/i.test(s)) return true;
  if (/^\d+(?:[-_.]\d+)*$/.test(s)) return true;
  return false;
}

function reconstructOpenAlexAbstract(index) {
  if (!index || typeof index !== 'object') return '';
  const out = [];
  Object.entries(index).forEach(([word, positions]) => {
    (positions || []).forEach(pos => { out[pos] = word; });
  });
  return out.filter(Boolean).join(' ');
}

function uniqueByName(list) {
  const seen = new Set();
  return (list || []).filter(x => {
    const key = String(x?.name || x || '').trim().toLowerCase();
    if (!key || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function parseAuthorString(value) {
  const s = String(value || '').trim();
  if (!s) return [];
  const parts = s.includes(';') ? s.split(';') : s.split(/\s+and\s+/i);
  return uniqueByName(parts.map(name => ({ name: name.trim() })).filter(x => x.name));
}

async function fetchJsonWithTimeout(url, timeoutMs=14000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

function normalizeOpenAlexWork(work, seed={}) {
  if (!work) return null;
  const authors = (work.authorships || []).map(a => ({
    name: a?.author?.display_name || '',
    openAlexId: a?.author?.id || '',
    orcid: a?.author?.orcid || '',
    position: a?.author_position || '',
    corresponding: !!a?.is_corresponding,
    institutions: (a?.institutions || []).map(i => ({
      name: i?.display_name || '',
      openAlexId: i?.id || '',
      countryCode: i?.country_code || '',
      type: i?.type || ''
    })).filter(i => i.name)
  })).filter(a => a.name);

  const institutions = uniqueByName(authors.flatMap(a => a.institutions || []));
  const automaticTopics = (work.topics || []).slice(0, 8).map(t => ({
    name: t?.display_name || '',
    id: t?.id || '',
    score: Number(t?.score || 0),
    subfield: t?.subfield?.display_name || '',
    field: t?.field?.display_name || '',
    domain: t?.domain?.display_name || ''
  })).filter(t => t.name);
  const location = work.primary_location || {};
  const source = location.source || {};
  const doi = cleanDoi(work.doi || seed.doi || '');

  return {
    title: work.title || work.display_name || seed.title || '',
    doi,
    arxivId: seed.arxivId || extractArxivId([work.title, location.landing_page_url].join(' ')),
    openAlexId: work.id || '',
    publicationDate: work.publication_date || '',
    year: Number(work.publication_year || 0) || null,
    venue: source.display_name || '',
    venueId: source.id || '',
    volume: work.biblio?.volume || '',
    issue: work.biblio?.issue || '',
    pages: work.biblio?.first_page ? [work.biblio.first_page, work.biblio.last_page].filter(Boolean).join('-') : '',
    publisher: source.host_organization_name || '',
    type: work.type || '',
    authors,
    institutions,
    abstract: reconstructOpenAlexAbstract(work.abstract_inverted_index) || seed.abstract || '',
    automaticTopics,
    primaryTopic: work.primary_topic?.display_name || automaticTopics[0]?.name || '',
    keywords: (work.keywords || []).slice(0, 12).map(k => k?.display_name || '').filter(Boolean),
    relatedWorks: (work.related_works || []).slice(0, 30),
    referencedWorks: (work.referenced_works || []).slice(0, 200),
    openAccess: work.open_access || null,
    landingPageUrl: location.landing_page_url || work.doi || '',
    metadataSource: 'OpenAlex',
    matchMethod: work.__repoLibraryMatch?.method || (seed.doi ? 'doi-exact' : 'title-search'),
    matchConfidence: Number(work.__repoLibraryMatch?.confidence || (seed.doi ? 0.99 : 0)),
    matchedFromPdf: !!seed.fromHistoricalPdf,
    updatedAt: Date.now(),
    citations: {
      count: Number(work.cited_by_count || 0),
      source: 'OpenAlex',
      updatedAt: Date.now()
    }
  };
}

function normalizeCrossrefWork(message, seed={}) {
  if (!message) return null;
  const dateParts = message.published?.['date-parts']?.[0] || message.issued?.['date-parts']?.[0] || [];
  const publicationDate = dateParts.length
    ? `${dateParts[0]}-${String(dateParts[1] || 1).padStart(2,'0')}-${String(dateParts[2] || 1).padStart(2,'0')}`
    : '';
  const authors = (message.author || []).map(a => ({
    name: [a.given, a.family].filter(Boolean).join(' '),
    orcid: a.ORCID || '',
    institutions: (a.affiliation || []).map(x => ({ name: x.name || '' })).filter(x => x.name)
  })).filter(a => a.name);
  return {
    title: message.title?.[0] || seed.title || '',
    doi: cleanDoi(message.DOI || seed.doi || ''),
    arxivId: seed.arxivId || '',
    publicationDate,
    year: Number(dateParts[0] || 0) || null,
    venue: message['container-title']?.[0] || '',
    volume: message.volume || '',
    issue: message.issue || '',
    pages: message.page || message.article_number || '',
    publisher: message.publisher || '',
    type: message.type || '',
    authors,
    institutions: uniqueByName(authors.flatMap(a => a.institutions || [])),
    abstract: String(message.abstract || seed.abstract || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(),
    automaticTopics: [],
    keywords: message.subject || [],
    metadataSource: 'Crossref',
    matchMethod: 'doi-crossref',
    matchConfidence: 0.98,
    matchedFromPdf: !!seed.fromHistoricalPdf,
    updatedAt: Date.now(),
    citations: {
      count: Number(message['is-referenced-by-count'] || 0),
      source: 'Crossref',
      updatedAt: Date.now()
    }
  };
}

async function queryOpenAlex(seed) {
  let url = '';
  if (seed.doi) {
    const value = `https://doi.org/${cleanDoi(seed.doi)}`;
    url = `https://api.openalex.org/works?filter=doi:${encodeURIComponent(value)}&per_page=1`;
  } else {
    const query = seed.arxivId || seed.title;
    if (!query) return null;
    url = `https://api.openalex.org/works?search=${encodeURIComponent(query)}&per_page=5`;
  }
  const data = await fetchJsonWithTimeout(url);
  const candidates = data?.results || [];
  if (!candidates.length) return null;
  if (seed.doi) return { ...candidates[0], __repoLibraryMatch: { method: 'doi-exact', confidence: 0.99 } };
  const ranked = candidates
    .map(w => ({ work: w, score: titleSimilarity(seed.title, w.title || w.display_name) }))
    .sort((a,b) => b.score - a.score);
  if (seed.title && ranked[0]?.score < 0.45 && !seed.arxivId) return null;
  const confidence = seed.arxivId ? Math.max(0.93, ranked[0]?.score || 0) : (ranked[0]?.score || 0);
  return ranked[0]?.work ? { ...ranked[0].work, __repoLibraryMatch: { method: seed.arxivId ? 'arxiv-search' : 'title-search', confidence } } : null;
}

async function queryCrossref(seed) {
  if (!seed.doi) return null;
  const url = `https://api.crossref.org/works/${encodeURIComponent(cleanDoi(seed.doi))}`;
  const data = await fetchJsonWithTimeout(url);
  return data?.message || null;
}

async function resolveScholarlyMetadata(seed) {
  const cleanSeed = {
    ...seed,
    doi: cleanDoi(seed?.doi || ''),
    arxivId: seed?.arxivId || extractArxivId([seed?.title, seed?.text].join(' '))
  };
  try {
    const work = await queryOpenAlex(cleanSeed);
    if (work) return normalizeOpenAlexWork(work, cleanSeed);
  } catch (e) {
    console.warn('OpenAlex metadata lookup failed', e);
  }
  try {
    const work = await queryCrossref(cleanSeed);
    if (work) return normalizeCrossrefWork(work, cleanSeed);
  } catch (e) {
    console.warn('Crossref metadata lookup failed', e);
  }
  return {
    title: cleanSeed.title || '',
    doi: cleanSeed.doi || '',
    arxivId: cleanSeed.arxivId || '',
    authors: cleanSeed.authors || [],
    institutions: [],
    venue: '',
    year: null,
    publicationDate: '',
    abstract: cleanSeed.abstract || '',
    automaticTopics: [],
    keywords: cleanSeed.keywords || [],
    metadataSource: 'PDF-local',
    matchMethod: cleanSeed.fromHistoricalPdf ? 'pdf-local-only' : 'local-only',
    matchConfidence: cleanSeed.fromHistoricalPdf ? 0.35 : 0,
    matchedFromPdf: !!cleanSeed.fromHistoricalPdf,
    updatedAt: Date.now(),
    metadataError: '未在 OpenAlex/Crossref 中可靠匹配，请在编辑条目中补充 DOI 或题名。',
    citations: { count: 0, source: '', updatedAt: 0 }
  };
}

async function extractPdfSeedMetadata(file, maxPages=3) {
  if (!file || extOf(file.name) !== 'pdf') return { title: file?.name?.replace(/\.[^/.]+$/, '') || '' };
  const fallback = {
    title: file.name.replace(/\.[^/.]+$/, ''),
    doi: extractDoi(file.name),
    arxivId: extractArxivId(file.name),
    authors: [],
    abstract: '',
    keywords: [],
    text: ''
  };
  if (!window.pdfjsLib) return fallback;
  try {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const bytes = new Uint8Array(await file.arrayBuffer());
    const doc = await window.pdfjsLib.getDocument({ data: bytes }).promise;
    const meta = await doc.getMetadata().catch(() => ({ info: {}, metadata: null }));
    const info = meta?.info || {};
    const pageTexts = [];
    const n = Math.min(doc.numPages || 1, maxPages);
    for (let p=1; p<=n; p++) {
      const page = await doc.getPage(p);
      const tc = await page.getTextContent();
      pageTexts.push((tc.items || []).map(x => x.str || '').join(' '));
    }
    const text = pageTexts.join('\n').replace(/\s+/g, ' ').trim();
    const abstractMatch = text.match(/\bAbstract\b[\s:—-]*(.{80,2200}?)(?=\b(?:Keywords?|PACS|Introduction|I\.|1\.)\b)/i);
    const infoTitle = String(info.Title || '').trim();
    const titleLooksGeneric = !infoTitle || /^(untitled|article|document|microsoft word)/i.test(infoTitle);
    return {
      ...fallback,
      title: titleLooksGeneric ? fallback.title : infoTitle,
      doi: extractDoi([info.Subject, info.Keywords, text, file.name].join(' ')),
      arxivId: extractArxivId([info.Subject, info.Keywords, text, file.name].join(' ')),
      authors: parseAuthorString(info.Author),
      abstract: abstractMatch ? abstractMatch[1].trim() : '',
      keywords: splitLegacyList(info.Keywords || ''),
      text: text.slice(0, 10000),
      pdfPages: doc.numPages || null,
      pdfMetadataTitle: infoTitle || '',
      extractedAt: Date.now()
    };
  } catch (e) {
    console.warn('PDF metadata extraction failed', e);
    return { ...fallback, metadataError: e.message || String(e) };
  }
}

async function buildMetadataForUpload(file) {
  const seed = await extractPdfSeedMetadata(file);
  const resolved = await resolveScholarlyMetadata(seed);
  return {
    scholarly: {
      ...resolved,
      pdfPages: seed.pdfPages || null,
      localExtractedAt: seed.extractedAt || Date.now()
    },
    citations: resolved?.citations || { count: 0, source: '', updatedAt: 0 }
  };
}

/* ============ v5 user-maintained paper card ============ */
function textList(value) {
  if (Array.isArray(value)) return value.map(x => String(x?.name || x || '').trim()).filter(Boolean);
  return String(value || '').split(/[;；\n]/).map(x => x.trim()).filter(Boolean);
}

function inferPublicationStatus(scholarly={}) {
  const venue = String(scholarly.venue || '').trim();
  if (scholarly.arxivId && (!venue || /arxiv|preprint/i.test(venue))) return 'preprint';
  if (venue || scholarly.doi) return 'published';
  return 'unpublished';
}

function paperCardStatusLabel(value) {
  return ({ published: 'Published article', preprint: 'Preprint', accepted: 'Accepted manuscript', unpublished: 'Research record' })[value] || 'Research record';
}

function citationKeyFromCard(card={}) {
  const first = String(card.authors?.[0] || 'paper').trim().split(/\s+/).pop() || 'paper';
  const keyword = String(card.title || 'work').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim().split(/\s+/).find(x => x.length > 3) || 'work';
  return `${first}${card.year || 'nd'}${keyword}`.replace(/[^a-zA-Z0-9_-]/g, '');
}

function buildPaperCardSnapshot(item={}, scholarly=scholarlyOf(item), source='upload-auto') {
  const s = scholarly || {};
  const authors = textList(s.authors || []);
  const affiliations = uniqueByName([
    ...(s.institutions || []),
    ...(s.authors || []).flatMap(a => a?.institutions || [])
  ].map(x => typeof x === 'string' ? { name: x } : x)).map(x => x.name);
  const year = Number(s.year || String(s.publicationDate || '').slice(0,4) || new Date(item.ts || Date.now()).getFullYear()) || null;
  const doi = cleanDoi(s.doi || item.doi || '');
  const arxivId = s.arxivId || item.arxivId || '';
  const card = {
    schemaVersion: 1,
    frozenAt: Date.now(),
    updatedAt: Date.now(),
    source,
    title: s.title || item.title || String(item.filename || '').replace(/\.[^/.]+$/, ''),
    authors,
    affiliations,
    publicationStatus: inferPublicationStatus(s),
    journal: s.venue || '',
    year,
    volume: s.volume || '',
    issue: s.issue || '',
    pages: s.pages || '',
    publisher: s.publisher || '',
    doi,
    arxivId,
    citationKey: '',
    bibtexEntryType: inferPublicationStatus(s) === 'published' ? 'article' : 'misc',
    links: {
      pdf: '',
      doi: doi ? `https://doi.org/${doi}` : '',
      arxiv: arxivId ? `https://arxiv.org/abs/${arxivId}` : '',
      publisher: s.landingPageUrl || '',
      code: '',
      project: ''
    },
    evaluation: { shortReview: '', relevance: '', readingStatus: 'unread', starred: false }
  };
  card.citationKey = citationKeyFromCard(card);
  return card;
}

function paperCardOf(item={}) {
  const fallback = buildPaperCardSnapshot(item, scholarlyOf(item), 'derived-display');
  const saved = item?.paperCard;
  if (!saved || typeof saved !== 'object') return fallback;
  return {
    ...fallback,
    ...saved,
    authors: Array.isArray(saved.authors) ? textList(saved.authors) : fallback.authors,
    affiliations: Array.isArray(saved.affiliations) ? textList(saved.affiliations) : fallback.affiliations,
    links: { ...fallback.links, ...(saved.links || {}) },
    evaluation: { ...fallback.evaluation, ...(saved.evaluation || {}) }
  };
}

function bibtexEscape(value) {
  return String(value || '').replace(/\s+/g, ' ').trim().replace(/([%&#])/g, '\\$1');
}

function formatBibtex(item) {
  const c = paperCardOf(item);
  const entryType = c.bibtexEntryType || (c.publicationStatus === 'published' ? 'article' : 'misc');
  const fields = [
    ['title', c.title],
    ['author', (c.authors || []).join(' and ')],
    [entryType === 'article' ? 'journal' : 'howpublished', entryType === 'article' ? c.journal : (c.arxivId ? `arXiv:${c.arxivId}` : c.journal)],
    ['year', c.year],
    ['volume', c.volume],
    ['number', c.issue],
    ['pages', c.pages],
    ['publisher', c.publisher],
    ['doi', c.doi],
    ['eprint', c.arxivId],
    ['archivePrefix', c.arxivId ? 'arXiv' : ''],
    ['url', c.links?.doi || c.links?.publisher || c.links?.arxiv || c.links?.pdf]
  ].filter(([,value]) => value !== '' && value !== null && value !== undefined);
  const key = c.citationKey || citationKeyFromCard(c) || 'paper';
  return `@${entryType}{${key},\n${fields.map(([name,value]) => `  ${name} = {${bibtexEscape(value)}}`).join(',\n')}\n}`;
}

async function copyText(value) {
  if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(String(value || ''));
  const area = document.createElement('textarea');
  area.value = String(value || '');
  area.style.position = 'fixed'; area.style.opacity = '0';
  document.body.appendChild(area); area.select(); document.execCommand('copy'); area.remove();
}

function itemRawHref(cfg, item) {
  if (item?.storage?.owner && item?.storage?.repo && item?.storage?.path) {
    return ghRawUrl({ owner: item.storage.owner, repo: item.storage.repo, branch: item.storage.branch || cfg.pdf?.branch || 'main', path: item.storage.path });
  }
  return buildRawUrl(cfg, item?.path);
}

function itemPdfHref(cfg, item) {
  const manual = paperCardOf(item).links?.pdf;
  return manual || (item?.kind === 'pdf' ? buildPdfBrowserUrl(item.path) : itemRawHref(cfg, item));
}

/* ============ v5.2 B5 literature book ============ */
function escapeBookHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[ch]);
}

function safeBookUrl(value) {
  try {
    const url = new URL(String(value || ''), window.location.href);
    return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
  } catch { return ''; }
}

function bookFilename(value) {
  const clean = String(value || 'Research-Library').trim().replace(/[^\p{L}\p{N}_-]+/gu, '-').replace(/^-+|-+$/g, '');
  return `${clean || 'Research-Library'}-B5`;
}

function needsHistoricalMetadata(item) {
  if ((item?.kind || guessKind(item?.filename || item?.path)) !== 'pdf') return false;
  const s = scholarlyOf(item);
  if (String(s.metadataReview?.status || '').startsWith('accepted')) return false;
  return !s.metadataSource || !!s.metadataError || !authorsOf(item).length || (!s.doi && !s.arxivId) || (!s.publicationDate && !s.year);
}

function historicalPdfUrl(cfg, item) {
  if (item?.storage?.owner && item?.storage?.repo && item?.storage?.path) {
    return ghRawUrl({
      owner: item.storage.owner,
      repo: item.storage.repo,
      branch: item.storage.branch || cfg.pdf?.branch || 'main',
      path: item.storage.path
    });
  }
  if (item?.path && isAbsoluteUrl(item.path)) return item.path;
  return buildRawUrl(cfg, item?.path || '');
}

async function downloadHistoricalPdf(cfg, item, token, maxMb=95) {
  const url = historicalPdfUrl(cfg, item);
  if (!url || url === '#') throw new Error('条目没有可读取的 PDF 路径');
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 60000);
  try {
    const headers = token && /(?:api\.github\.com|raw\.githubusercontent\.com)/.test(url)
      ? { Authorization: `Bearer ${token}` }
      : {};
    const res = await fetch(cacheBustUrl(url), { cache: 'no-store', headers, signal: controller.signal });
    if (!res.ok) throw new Error(`PDF 下载失败：${res.status} ${res.statusText}`);
    const length = Number(res.headers.get('content-length') || 0);
    if (length > maxMb * 1024 * 1024) throw new Error(`PDF 超过 ${maxMb} MB，跳过浏览器解析`);
    const blob = await res.blob();
    if (blob.size > maxMb * 1024 * 1024) throw new Error(`PDF 超过 ${maxMb} MB，跳过浏览器解析`);
    if (!blob.size) throw new Error('下载到的 PDF 为空');
    return new File([blob], item.filename || `${item.id || 'historical'}.pdf`, { type: 'application/pdf' });
  } finally { clearTimeout(timer); }
}

function historicalIndexSeed(item) {
  const s = scholarlyOf(item);
  const rawTitle = s.title || item?.title || String(item?.filename || '').replace(/\.[^/.]+$/, '');
  return {
    title: looksGenericPaperTitle(rawTitle) ? '' : rawTitle,
    doi: cleanDoi(s.doi || item?.doi || extractDoi([item?.title, item?.filename, item?.desc].join(' '))),
    arxivId: s.arxivId || extractArxivId([item?.title, item?.filename, item?.desc].join(' ')),
    authors: authorsOf(item),
    abstract: s.abstract || item?.desc || '',
    keywords: s.keywords || item?.tags || []
  };
}

async function scanHistoricalItem(cfg, item, token, threshold=0.78) {
  const startedAt = Date.now();
  const base = { itemId: item.id, originalTitle: makePaperLabel(item), startedAt };
  let first = null;
  let pdfSeed = null;
  let pdfError = '';
  try {
    const seed = historicalIndexSeed(item);
    if (seed.doi || seed.arxivId || seed.title) first = await resolveScholarlyMetadata(seed);
    if (first?.metadataSource !== 'PDF-local' && Number(first?.matchConfidence || 0) >= threshold) {
      return { ...base, status: 'accepted', stage: 'index', confidence: Number(first.matchConfidence), method: first.matchMethod || 'index-match', suggested: first, pdfParsed: false, finishedAt: Date.now() };
    }
  } catch (e) {
    console.warn('历史条目索引匹配失败，继续尝试 PDF', e);
  }

  try {
    const file = await downloadHistoricalPdf(cfg, item, token);
    pdfSeed = await extractPdfSeedMetadata(file, 3);
    const baseSeed = historicalIndexSeed(item);
    const resolved = await resolveScholarlyMetadata({
      ...baseSeed,
      ...pdfSeed,
      title: (!looksGenericPaperTitle(pdfSeed.title) ? pdfSeed.title : baseSeed.title),
      doi: pdfSeed.doi || baseSeed.doi,
      arxivId: pdfSeed.arxivId || baseSeed.arxivId,
      authors: pdfSeed.authors?.length ? pdfSeed.authors : baseSeed.authors,
      abstract: pdfSeed.abstract || baseSeed.abstract,
      fromHistoricalPdf: true
    });
    const confidence = Number(resolved.matchConfidence || 0);
    const matched = resolved.metadataSource !== 'PDF-local';
    return {
      ...base,
      status: matched && confidence >= threshold ? 'accepted' : 'review',
      stage: 'pdf',
      confidence,
      method: resolved.matchMethod || 'pdf-local-only',
      suggested: { ...resolved, pdfPages: pdfSeed.pdfPages || null, historicalExtractedAt: Date.now() },
      pdfParsed: true,
      extractedDoi: pdfSeed.doi || '',
      extractedTitle: pdfSeed.title || '',
      message: matched ? '' : '已解析 PDF，但尚未在 OpenAlex/Crossref 中可靠匹配。',
      finishedAt: Date.now()
    };
  } catch (e) {
    pdfError = e.message || String(e);
  }

  if (first && first.metadataSource !== 'PDF-local') {
    const confidence = Number(first.matchConfidence || 0);
    return { ...base, status: 'review', stage: 'index', confidence, method: first.matchMethod || 'title-search', suggested: first, pdfParsed: false, message: `PDF 解析失败，保留低置信度索引匹配：${pdfError}`, finishedAt: Date.now() };
  }
  return { ...base, status: 'unmatched', stage: 'pdf', confidence: 0, method: 'unmatched', suggested: pdfSeed || first || {}, pdfParsed: !!pdfSeed, message: pdfError || '没有可靠匹配', finishedAt: Date.now() };
}

function applyHistoricalSuggestion(item, result, acceptedManually=false) {
  const suggested = result?.suggested || {};
  const citations = suggested.citations || item.citations || { count: 0, source: '', updatedAt: 0 };
  const mergedScholarly = {
    ...scholarlyOf(item),
    ...suggested,
    metadataError: '',
    metadataWarning: acceptedManually && result.confidence < 0.78 ? '该结果由管理员从低置信度候选中手工确认。' : '',
    metadataReview: {
      status: acceptedManually ? 'accepted-manually' : 'accepted-auto',
      confidence: Number(result.confidence || 0),
      method: result.method || '',
      stage: result.stage || '',
      reviewedAt: Date.now()
    }
  };
  return {
    ...item,
    scholarly: mergedScholarly,
    paperCard: item.paperCard || buildPaperCardSnapshot({ ...item, scholarly: mergedScholarly }, mergedScholarly, 'backfill-auto'),
    citations
  };
}

function b64EncodeUint8(arr) {
  // Chunked encoding avoids extremely slow string concatenation for medium/large PDFs.
  const chunkSize = 0x8000;
  const parts = [];
  for (let i = 0; i < arr.byteLength; i += chunkSize) {
    const chunk = arr.subarray(i, i + chunkSize);
    let s = '';
    for (let j = 0; j < chunk.length; j++) s += String.fromCharCode(chunk[j]);
    parts.push(s);
  }
  return btoa(parts.join(''));
}

/* ============ GitHub helpers (multi-repo) ============ */
function isAbsoluteUrl(path) { return /^https?:\/\//.test(path || ''); }

function ghRawUrl({ owner, repo, branch, path }) {
  return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${path}`;
}

function buildRawUrl(cfg, path) {
  if (!path) return '#';
  if (isAbsoluteUrl(path)) return path;
  return ghRawUrl({ owner: cfg.owner, repo: cfg.repo, branch: cfg.branch, path });
}

/**
 * PDF 在浏览器打开：
 * - 新条目：item.path 往往是 Pages 的绝对 URL（直接用）
 * - 旧条目：相对路径（data/files/...），转为站点路径 /data/files/...
 * - 也兼容 github.com/blob 和 raw.githubusercontent.com 的路径提取（保持你旧逻辑）
 */
function buildPdfBrowserUrl(path) {
  if (!path) return '#';
  if (isAbsoluteUrl(path)) return path;

  try {
    const u = new URL(path);
    const host = u.hostname;
    const pathname = u.pathname;

    if (host === 'github.com') {
      const blobIndex = pathname.indexOf('/blob/');
      if (blobIndex !== -1) {
        const afterBlob = pathname.substring(blobIndex + '/blob/'.length);
        const firstSlash = afterBlob.indexOf('/');
        if (firstSlash !== -1) {
          const rest = afterBlob.substring(firstSlash + 1);
          return '/' + rest;
        }
      }
      return pathname;
    }

    if (host === 'raw.githubusercontent.com') {
      const parts = pathname.split('/').filter(Boolean);
      if (parts.length >= 4) {
        const rest = parts.slice(3).join('/');
        return '/' + rest;
      }
      return pathname;
    }

    return path;
  } catch {
    if (path.startsWith('/')) return path;
    return '/' + path;
  }
}

function cacheBustUrl(url) {
  const sep = String(url).includes('?') ? '&' : '?';
  return `${url}${sep}_repoLibraryFresh=${Date.now()}_${Math.random().toString(36).slice(2)}`;
}

async function ghGetJSONRaw(owner, repo, branch, path) {
  const url = cacheBustUrl(ghRawUrl({ owner, repo, branch, path }));
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) return null;
  return await res.json();
}

async function ghGetTextRaw(owner, repo, branch, path) {
  const url = cacheBustUrl(ghRawUrl({ owner, repo, branch, path }));
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) return null;
  return await res.text();
}

function encodeGitHubPath(path) {
  return String(path || '').split('/').map(encodeURIComponent).join('/');
}

function ghHeaders(token, extra={}) {
  return {
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2026-03-10',
    ...(token ? { Authorization: `Bearer ${token}` } : {}),
    ...extra,
  };
}

// 同一页面中的连续 metadata -> ready 更新直接沿用 SHA 链；若仓库被外部修改，409 后清空缓存并强制重新读取。
const INDEX_WRITE_CACHE = new Map();

function indexWriteCacheKey(cfg) {
  return `${cfg.owner}/${cfg.repo}@${cfg.branch || 'main'}:${cfg.indexPath}`;
}

function cloneJson(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function invalidateIndexWriteCache(cfg) {
  INDEX_WRITE_CACHE.delete(indexWriteCacheKey(cfg));
}

function b64DecodeToText(b64) {
  const clean = String(b64 || '').replace(/\s/g, '');
  const bin = atob(clean);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(arr);
}

function resolvePdfRepoNameFromCfg(cfg, year) {
  const pdf = cfg.pdf || {};
  if (pdf.manualRepo && pdf.manualRepo.trim()) return pdf.manualRepo.trim();
  const prefix = pdf.repoPrefix || 'cheneit-pdf-';
  return `${prefix}${year}`;
}

function resolvePagesBaseFromCfg(cfg, owner, repo) {
  const pdf = cfg.pdf || {};
  if (pdf.pagesBase && pdf.pagesBase.trim()) return pdf.pagesBase.replace(/\/+$/,'');
  return `https://${owner}.github.io/${repo}`;
}

function normalizeIndexData(data) {
  if (Array.isArray(data)) return { items: data };
  if (!data || typeof data !== 'object') return { items: [] };
  if (!Array.isArray(data.items)) data.items = [];
  return data;
}


/* ============ v3 legacy-data migration helpers ============ */
function splitLegacyList(value) {
  if (Array.isArray(value)) return value.map(v => String(v).trim()).filter(Boolean);
  if (value === null || value === undefined || value === '') return [];
  return String(value).split(/[,，;；|]/).map(v => v.trim()).filter(Boolean);
}

function legacyStableId(item, index=0) {
  if (item?.id) return String(item.id);
  const src = `${item?.path || ''}|${item?.filename || ''}|${item?.title || ''}|${item?.ts || ''}|${index}`;
  let h = 2166136261;
  for (let i=0; i<src.length; i++) {
    h ^= src.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return `legacy_${(h >>> 0).toString(36)}`;
}

function filenameFromPath(path) {
  try {
    const clean = String(path || '').split('?')[0].split('#')[0];
    const part = clean.split('/').filter(Boolean).pop() || '';
    return decodeURIComponent(part);
  } catch {
    return String(path || '').split('/').filter(Boolean).pop() || '';
  }
}

function normalizeLegacyTimestamp(value) {
  if (value === null || value === undefined || value === '') return 0;
  if (typeof value === 'number' && Number.isFinite(value)) {
    return value > 0 && value < 1e11 ? value * 1000 : value;
  }
  const n = Number(value);
  if (Number.isFinite(n) && n > 0) return n < 1e11 ? n * 1000 : n;
  const parsed = Date.parse(String(value));
  return Number.isFinite(parsed) ? parsed : 0;
}


function inferLegacyStorage(path, cfg) {
  if (!path) return null;
  if (!isAbsoluteUrl(path)) {
    return { owner: cfg.owner, repo: cfg.repo, branch: cfg.branch, path, legacyMainRepo: true };
  }
  try {
    const u = new URL(path);
    const parts = u.pathname.split('/').filter(Boolean);
    if (u.hostname === 'raw.githubusercontent.com' && parts.length >= 4) {
      return { owner: parts[0], repo: parts[1], branch: parts[2], path: parts.slice(3).join('/'), inferredFromUrl: true };
    }
    if (u.hostname === 'github.com') {
      const blobAt = parts.indexOf('blob');
      if (blobAt === 2 && parts.length >= 5) {
        return { owner: parts[0], repo: parts[1], branch: parts[3], path: parts.slice(4).join('/'), inferredFromUrl: true };
      }
    }
    const expectedPagesHost = `${cfg.owner}.github.io`.toLowerCase();
    if (u.hostname.toLowerCase() === expectedPagesHost) {
      // User/organization Pages repo: https://owner.github.io/data/files/...
      if (cfg.repo === `${cfg.owner}.github.io`) {
        const first = parts[0] || '';
        // 若第一段像 PDF 分仓仓库名，则按 project Pages 推断；否则按主仓库推断。
        if (first && (first === cfg.pdf?.manualRepo || first.startsWith(cfg.pdf?.repoPrefix || 'cheneit-pdf-'))) {
          return { owner: cfg.owner, repo: first, branch: cfg.pdf?.branch || 'main', path: parts.slice(1).join('/'), inferredFromPages: true };
        }
        return { owner: cfg.owner, repo: cfg.repo, branch: cfg.branch, path: parts.join('/'), legacyMainRepo: true, inferredFromPages: true };
      }
      // Project Pages: https://owner.github.io/repo/path
      if (parts.length >= 2) {
        return { owner: cfg.owner, repo: parts[0], branch: cfg.pdf?.branch || 'main', path: parts.slice(1).join('/'), inferredFromPages: true };
      }
    }
  } catch {}
  return null;
}

function migrateLegacyItem(item, cfg, index=0) {
  const src = (item && typeof item === 'object') ? item : {};
  const path = src.path || src.url || src.filePath || '';
  const filename = src.filename || src.fileName || src.name || filenameFromPath(path) || `legacy-${index+1}`;
  const kind = guessKind(filename || path, src.kind || src.type || undefined);
  const topics = splitLegacyList(src.topics?.length ? src.topics : (src.topic || src.category || ''));
  const tags = splitLegacyList(src.tags || src.tag || []);
  const ts = normalizeLegacyTimestamp(src.ts ?? src.timestamp ?? src.date ?? src.createdAt);
  const existingStorage = (src.storage && typeof src.storage === 'object') ? src.storage : null;
  const storage = existingStorage || inferLegacyStorage(path, cfg);

  let uploadStatus = src.uploadStatus || '';
  if (!uploadStatus) uploadStatus = path ? 'ready' : (kind === 'pdf' ? 'pdf_pending' : 'file_pending');

  const migrated = {
    ...src,
    id: legacyStableId(src, index),
    title: src.title || src.name || filename.replace(/\.[^/.]+$/, ''),
    filename,
    path,
    kind,
    topics,
    topic: topics[0] || '',
    tags,
    ts,
    size: Number(src.size || 0) || 0,
    desc: src.desc ?? src.description ?? src.note ?? '',
    imagePath: src.imagePath || src.coverPath || src.cover || '',
    storage,
    uploadStatus,
    uploadError: src.uploadError || '',
    imageUploadError: src.imageUploadError || '',
    groups: splitLegacyList(src.groups || src.group || []),
    scholarly: (src.scholarly && typeof src.scholarly === 'object') ? src.scholarly : {},
    citations: (src.citations && typeof src.citations === 'object') ? src.citations : (src.scholarly?.citations || { count: 0, source: '', updatedAt: 0 }),
  };

  return migrated;
}

function migrateIndexToV3(data, cfg) {
  const src = normalizeIndexData(typeof structuredClone === 'function' ? structuredClone(data || {}) : JSON.parse(JSON.stringify(data || {})));
  const report = {
    total: src.items.length,
    addedId: 0,
    normalizedTopics: 0,
    normalizedTags: 0,
    addedStorage: 0,
    addedUploadStatus: 0,
    missingPath: 0,
    missingTime: 0,
  };

  const migratedItems = src.items.map((item, i) => {
    if (!item?.id) report.addedId += 1;
    if (!Array.isArray(item?.topics)) report.normalizedTopics += 1;
    if (!Array.isArray(item?.tags)) report.normalizedTags += 1;
    if (!item?.storage && inferLegacyStorage(item?.path || item?.url || item?.filePath || '', cfg)) report.addedStorage += 1;
    if (!item?.uploadStatus) report.addedUploadStatus += 1;
    if (!item?.path) report.missingPath += 1;
    if (!normalizeLegacyTimestamp(item?.ts ?? item?.timestamp ?? item?.date ?? item?.createdAt)) report.missingTime += 1;
    return migrateLegacyItem(item, cfg, i);
  });

  const out = {
    ...src,
    schemaVersion: 3,
    migratedAt: Date.now(),
    items: migratedItems,
  };
  return { data: out, report };
}

function indexDirOf(path) {
  const parts = String(path || '').split('/').filter(Boolean);
  parts.pop();
  return parts.join('/');
}

function timestampForPath() {
  const d = new Date();
  const z = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;
}

async function ghGetContentMeta(owner, repo, path, token, branch) {
  const p = encodeGitHubPath(path);
  const ref = branch ? `?ref=${encodeURIComponent(branch)}` : '';
  // v3.1: GitHub Contents GET 必须是真正的 fresh read，否则连续 PUT 时可能拿到旧 SHA。
  const url = cacheBustUrl(`https://api.github.com/repos/${owner}/${repo}/contents/${p}${ref}`);
  const res = await fetch(url, {
    headers: ghHeaders(token),
    cache: 'no-store'
  });

  if (res.status === 404) return null;
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`GET meta failed: ${res.status} ${res.statusText} - ${txt}`);
  }
  return await res.json();
}

async function ghGetJSONContent(owner, repo, path, token, branch) {
  const meta = await ghGetContentMeta(owner, repo, path, token, branch);
  if (!meta) return null;
  if (meta.type !== 'file') throw new Error(`Index path is not a file: ${path}`);
  if (!meta.content) return await ghGetJSONRaw(owner, repo, branch || 'main', path);
  return JSON.parse(b64DecodeToText(meta.content));
}

async function ghPutContent(owner, repo, path, contentB64, message, token, sha, branch) {
  const p = encodeGitHubPath(path);
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${p}`;
  const body = { message, content: contentB64 };
  if (sha) body.sha = sha;
  if (branch) body.branch = branch;

  const res = await fetch(url, {
    method: 'PUT',
    headers: ghHeaders(token, { 'Content-Type': 'application/json' }),
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`PUT failed: ${res.status} ${res.statusText} - ${txt}`);
  }
  return res.json();
}

async function ghDeleteContent(owner, repo, path, message, token, sha, branch) {
  const p = encodeGitHubPath(path);
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${p}`;
  const body = { message, sha };
  if (branch) body.branch = branch;

  const res = await fetch(url, {
    method: 'DELETE',
    headers: ghHeaders(token, { 'Content-Type': 'application/json' }),
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`DELETE failed: ${res.status} ${res.statusText} - ${txt}`);
  }
  return res.json();
}

async function ghGetBranchHeadSha(owner, repo, branch, token) {

  }

function pagesBuildIsFailure(build) {
  const status = String(build?.status || '').toLowerCase();
  if (['errored', 'error', 'failed', 'failure', 'cancelled', 'canceled'].includes(status)) return true;
  return !!build?.error?.message && !['queued', 'building', 'built'].includes(status);
}

/**
 * 主动触发 branch-based GitHub Pages build，并等待“目标分支当前 HEAD”被构建。
 * - POST /pages/builds 需要 fine-grained PAT: Pages(write)
 * - GET /pages、/pages/builds/latest 需要 Pages(read)
 * - 先校验 Pages source branch，避免“文件写在 main、Pages 实际发布其他分支”的假成功。
 */
async function publishPagesRepo({ owner, repo, branch, token, onUpdate, timeoutMs=180000, pollMs=3000 }) {
  const emit = (status, detail, extra={}) => onUpdate && onUpdate({ status, detail, repo, branch, ...extra });
  emit('checking', '正在检查 Pages 配置…');

  const site = await ghGetPagesSite(owner, repo, token);
  if (!site) throw new Error(`${owner}/${repo} 尚未启用 GitHub Pages。请先在 Settings → Pages 配置 Deploy from a branch。`);

  const sourceBranch = site?.source?.branch || '';
  const sourcePath = site?.source?.path || '/';
  if (sourceBranch && branch && sourceBranch !== branch) {
    throw new Error(`Pages 发布分支为 ${sourceBranch}，但 Repo Library 正在写入 ${branch}。请统一分支后再发布。`);
  }
  if (site?.build_type === 'workflow') {
    throw new Error(`Pages 当前 build_type=workflow。v3.2 的主动 build API 面向 branch-based Pages；请在 Settings → Pages 改为 Deploy from a branch，或单独配置 workflow_dispatch。`);
  }

  const expectedCommit = await ghGetBranchHeadSha(owner, repo, branch, token);
  emit('requesting', `请求 Pages 构建：${branch}${sourcePath}…`, { expectedCommit });
  const request = await ghRequestPagesBuild(owner, repo, token);
  emit(request?.status || 'queued', `Pages 已进入构建队列，等待 ${expectedCommit.slice(0, 8)}…`, { expectedCommit });

  const startedAt = Date.now();
  let lastBuild = null;
  while (Date.now() - startedAt < timeoutMs) {
    await sleep(pollMs);
    lastBuild = await ghGetLatestPagesBuild(owner, repo, token);
    if (!lastBuild) {
      emit('waiting', '尚未读取到 Pages build，继续等待…', { expectedCommit });
      continue;
    }

    const status = String(lastBuild.status || 'unknown').toLowerCase();
    const buildCommit = String(lastBuild.commit || '');
    const sameCommit = !expectedCommit || buildCommit === expectedCommit;
    const errMsg = lastBuild?.error?.message || '';

    if (status === 'built' && sameCommit) {
      emit('built', `Pages 已发布目标 commit ${expectedCommit.slice(0, 8)}。`, { expectedCommit, build: lastBuild });
      return { ok: true, status: 'built', site, build: lastBuild, expectedCommit };
    }
    if (pagesBuildIsFailure(lastBuild) && sameCommit) {
      throw new Error(`Pages build 失败：${errMsg || status}`);
    }

    const detail = sameCommit
      ? `Pages 状态：${status}${errMsg ? `；${errMsg}` : ''}`
      : `等待目标 commit ${expectedCommit.slice(0, 8)}；当前 latest=${buildCommit ? buildCommit.slice(0,8) : 'unknown'} (${status})`;
    emit(status === 'built' ? 'waiting' : status, detail, { expectedCommit, build: lastBuild });
  }

  emit('timeout', `等待 Pages 超时；文件和 index 已提交，可稍后手动检查 Actions/Pages。`, { expectedCommit, build: lastBuild });
  return { ok: false, status: 'timeout', site, build: lastBuild, expectedCommit };
}

/**
 * 尝试自动创建 repo（如果 token 权限允许）

/* ============ Index update (主仓库 index.json) ============ */
async function readIndexFresh(cfg, token) {
  const meta = await ghGetContentMeta(cfg.owner, cfg.repo, cfg.indexPath, token, cfg.branch);
  let data = null;
  if (meta?.content) data = JSON.parse(b64DecodeToText(meta.content));
  else data = await ghGetJSONRaw(cfg.owner, cfg.repo, cfg.branch, cfg.indexPath);
  return { data: normalizeIndexData(data || { items: [] }), sha: meta?.sha || null };
}

function isGithubConflictError(e) {
  const msg = String(e?.message || e || '').toLowerCase();
  return msg.includes('409') || msg.includes('conflict') || msg.includes('does not match');
}

async function updateIndexMain(cfg, token, updater, message='Update index.json') {
  const key = indexWriteCacheKey(cfg);
  let lastErr = null;

  for (let attempt = 1; attempt <= 4; attempt += 1) {
    try {
      // v3.1 SHA chain: 第一次优先沿用前一次成功 PUT 返回的最新 SHA/data。
      // 发生 409 后 cache 会被清空，下一轮一定 fresh GET + merge。
      const cached = attempt === 1 ? INDEX_WRITE_CACHE.get(key) : null;
      let indexData, baseSha;

      if (cached?.sha && cached?.data) {
        indexData = normalizeIndexData(cloneJson(cached.data));
        baseSha = cached.sha;
      } else {
        const fresh = await readIndexFresh(cfg, token);
        indexData = fresh.data;
        baseSha = fresh.sha;
      }

      const newData = normalizeIndexData(await updater(indexData));
      const enc = new TextEncoder().encode(JSON.stringify(newData, null, 2));
      const b64 = b64EncodeUint8(new Uint8Array(enc));

      const result = await ghPutContent(
        cfg.owner,
        cfg.repo,
        cfg.indexPath,
        b64,
        message,
        token,
        baseSha,
        cfg.branch
      );

      // GitHub Create/Update contents 成功响应包含 content.sha；直接作为下一次写入的 base SHA。
      let newSha = result?.content?.sha || null;
      if (!newSha) {
        const verify = await ghGetContentMeta(cfg.owner, cfg.repo, cfg.indexPath, token, cfg.branch);
        newSha = verify?.sha || null;
      }

      if (newSha) {
        INDEX_WRITE_CACHE.set(key, {
          sha: newSha,
          data: cloneJson(newData),
          updatedAt: Date.now()
        });
      } else {
        INDEX_WRITE_CACHE.delete(key);
      }

      return newData;
    } catch (e) {
      lastErr = e;
      if (!isGithubConflictError(e) || attempt === 4) throw e;

      // 真正的 409 recovery：丢弃旧 SHA/data，下一轮从 GitHub fresh GET 最新 index，再执行 updater merge。
      INDEX_WRITE_CACHE.delete(key);
      await new Promise(r => setTimeout(r, 300 * attempt));
    }
  }

  throw lastErr;
}

/* ============ Upload cover (仍在主仓库) ============ */
async function uploadCoverIfNeeded(cfg, token, coverFile, existingPath) {
  if (!coverFile) return existingPath || '';
  const y = new Date().getFullYear();
  const m = String(new Date().getMonth() + 1).padStart(2, '0');
  const baseDir = `${cfg.dataDir}/${y}/${m}`;
  const buf = new Uint8Array(await coverFile.arrayBuffer());
  const b64 = b64EncodeUint8(buf);
  const imgName = `${uid()}__${coverFile.name}`;
  const imagePath = `${baseDir}/images/${imgName}`;

  const meta = await ghGetContentMeta(cfg.owner, cfg.repo, imagePath, token, cfg.branch);
  await ghPutContent(cfg.owner, cfg.repo, imagePath, b64, `Upload cover ${coverFile.name}`, token, meta?.sha, cfg.branch);
  return imagePath;
}

/* ============ v3.1 pending PDF repair ============ */
function isRepairablePdfItem(item) {
  if (item?.kind !== 'pdf') return false;
  const s = item.uploadStatus || '';
  return ['pdf_pending', 'upload_failed', 'partial_ready', 'metadata_created'].includes(s) || (!item.path && !item.storage);
}

function expectedPdfStorageForItem(cfg, item) {
  if (item?.storage?.owner && item?.storage?.repo && item?.storage?.path) {
    const owner = item.storage.owner;
    const repo = item.storage.repo;
    const branch = item.storage.branch || (cfg.pdf?.branch || 'main');
    const path = item.storage.path;
    const pagesBase = resolvePagesBaseFromCfg(cfg, owner, repo);
    return { owner, repo, branch, path, pagesUrl: item.path || `${pagesBase}/${path}` };
  }

  if (!item?.id) throw new Error('条目缺少 id，无法推导 PDF 分仓路径。');
  const d = new Date(item.createdTs || item.ts || Date.now());
  if (isNaN(d)) throw new Error('条目时间无效，无法推导 PDF 分仓路径。');
  const yy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const owner = cfg.owner;
  const repo = resolvePdfRepoNameFromCfg(cfg, yy);
  const branch = cfg.pdf?.branch || 'main';
  const baseDir = cfg.pdf?.dataDir || 'data/files';
  const path = `${baseDir}/${yy}/${mm}/${item.id}.pdf`;
  const pagesBase = resolvePagesBaseFromCfg(cfg, owner, repo);
  return { owner, repo, branch, path, pagesUrl: `${pagesBase}/${path}` };
}

async function repairPendingPdfItem(cfg, token, item) {
  if (!isRepairablePdfItem(item)) throw new Error('该条目当前不属于可自动修复的 pending/failed PDF。');
  const target = expectedPdfStorageForItem(cfg, item);

  // 只检查，不上传：只有远端文件真实存在时才修 index。
  const meta = await ghGetContentMeta(target.owner, target.repo, target.path, token, target.branch);
  if (!meta || meta.type !== 'file') {
    throw new Error(`分仓中未找到已上传 PDF：${target.repo}/${target.path}。这说明文件本体尚未上传，需要使用“替换PDF”补传。`);
  }

  const newData = await updateIndexMain(cfg, token, data => ({
    ...data,
    items: (data.items || []).map(x => x.id === item.id ? {
      ...x,
      path: target.pagesUrl,
      storage: {
        owner: target.owner,
        repo: target.repo,
        branch: target.branch,
        path: target.path
      },
      size: meta.size || x.size || 0,
      uploadStatus: 'ready',
      uploadError: '',
      repairedAt: Date.now()
    } : x)
  }), `Repair PDF index: ${item.filename || item.id}`);

  return { newData, target, meta };
}

/* ============ Dashboard computations ============ */
function getTopicsArr(item) {
  const arr = item?.topics || (item?.topic ? [item.topic] : []);
  return (arr || []).filter(Boolean);
}
function countBy(items, extractor) {
  const map = new Map();
  for (const it of items) {
    const keys = extractor(it) || [];
    for (const k of keys) {
      if (!k) continue;
      map.set(k, (map.get(k) || 0) + 1);
    }
  }
  return Array.from(map.entries()).sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]));
}

function scholarlyOf(item) { return item?.scholarly || {}; }
function citationOf(item) {
  const c = item?.citations || scholarlyOf(item).citations || {};
  return { count: Number(c.count || 0), source: c.source || '', updatedAt: Number(c.updatedAt || 0) };
}
function publicationYearOf(item) {
  if (item?.paperCard && Number(item.paperCard.year || 0)) return Number(item.paperCard.year);
  const s = scholarlyOf(item);
  const fromDate = Number(String(s.publicationDate || '').slice(0, 4));
  return Number(s.year || fromDate || new Date(item?.ts || 0).getFullYear() || 0) || null;
}
function authorsOf(item) {
  if (item?.paperCard && Array.isArray(item.paperCard.authors)) return textList(item.paperCard.authors).map(name => ({ name }));
  return (scholarlyOf(item).authors || []).map(a => typeof a === 'string' ? { name: a } : a).filter(a => a?.name);
}
function institutionsOf(item) {
  const s = scholarlyOf(item);
  const nested = authorsOf(item).flatMap(a => a.institutions || []);
  const manualGroups = (item?.groups || []).map(name => ({ name, manualGroup: true }));
  const cardAffiliations = item?.paperCard && Array.isArray(item.paperCard.affiliations) ? item.paperCard.affiliations : [];
  return uniqueByName([...cardAffiliations, ...(s.institutions || []), ...nested, ...manualGroups].map(x => typeof x === 'string' ? { name: x } : x));
}
function academicTimestamp(item) {
  const d = scholarlyOf(item).publicationDate;
  const parsed = d ? Date.parse(d) : NaN;
  if (item?.paperCard?.year && !Number.isFinite(parsed)) return Date.UTC(Number(item.paperCard.year), 0, 1);
  return Number.isFinite(parsed) ? parsed : Number(item?.ts || 0);
}
function isCitationStale(item, days=2) {
  const ts = citationOf(item).updatedAt;
  return !ts || (Date.now() - ts) > days * 86400000;
}
function makePaperLabel(item) { return item?.paperCard?.title || item?.title || scholarlyOf(item).title || item?.filename || '未命名文献'; }

function buildLiteratureStats(items) {
  const topicMap = new Map();
  const authorMap = new Map();
  const institutionMap = new Map();
  const linkMap = new Map();
  const yearMap = new Map();

  function touch(map, name, item) {
    if (!name) return;
    const key = String(name).trim();
    if (!key) return;
    if (!map.has(key)) map.set(key, { name: key, papers: [], citations: 0, topics: new Map(), latestYear: 0 });
    const row = map.get(key);
    if (!row.papers.some(x => x.id === item.id)) row.papers.push(item);
    row.citations += citationOf(item).count;
    row.latestYear = Math.max(row.latestYear, publicationYearOf(item) || 0);
    getTopicsArr(item).forEach(t => row.topics.set(t, (row.topics.get(t) || 0) + 1));
  }

  for (const item of items || []) {
    const topics = [...new Set(getTopicsArr(item))];
    const year = publicationYearOf(item);
    if (year) yearMap.set(year, (yearMap.get(year) || 0) + 1);
    topics.forEach(t => touch(topicMap, t, item));
    authorsOf(item).forEach(a => touch(authorMap, a.name, item));
    institutionsOf(item).forEach(g => touch(institutionMap, g.name, item));
    for (let i=0; i<topics.length; i++) {
      for (let j=i+1; j<topics.length; j++) {
        const pair = [topics[i], topics[j]].sort();
        const key = pair.join('\u0000');
        if (!linkMap.has(key)) linkMap.set(key, { source: pair[0], target: pair[1], count: 0, papers: [] });
        const link = linkMap.get(key);
        link.count += 1;
        link.papers.push(item);
      }
    }
  }

  const finish = map => Array.from(map.values()).map(row => ({
    ...row,
    count: row.papers.length,
    topTopics: Array.from(row.topics.entries()).sort((a,b)=>b[1]-a[1]).slice(0,4)
  })).sort((a,b)=>b.count-a.count || b.citations-a.citations || a.name.localeCompare(b.name));
  const topics = finish(topicMap).map(row => ({
    ...row,
    recent: [...row.papers].sort((a,b)=>academicTimestamp(b)-academicTimestamp(a)),
    years: Array.from(row.papers.reduce((m,p)=>{
      const y=publicationYearOf(p); if(y) m.set(y,(m.get(y)||0)+1); return m;
    }, new Map()).entries()).sort((a,b)=>a[0]-b[0])
  }));

  return {
    topics,
    authors: finish(authorMap),
    institutions: finish(institutionMap),
    links: Array.from(linkMap.values()).sort((a,b)=>b.count-a.count),
    years: Array.from(yearMap.entries()).sort((a,b)=>a[0]-b[0]),
    citationRanking: [...(items || [])].sort((a,b)=>citationOf(b).count-citationOf(a).count),
    coverage: {
      scholarly: (items || []).filter(x => scholarlyOf(x).metadataSource).length,
      paperCards: (items || []).filter(x => x.paperCard).length,
      doi: (items || []).filter(x => paperCardOf(x).doi).length,
      authors: (items || []).filter(x => authorsOf(x).length).length,
      citations: (items || []).filter(x => citationOf(x).source).length,
    }
  };
}

function buildHeatmap(items, days=365) {
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const addDays = (d, n) => {
    const out = new Date(d);
    out.setDate(out.getDate() + n);
    return out;
  };
  const dayKey = (d) => {
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${dd}`;
  };
  // v3：按中国/ISO 日历习惯，以周一为第一行，周日为最后一行。
  // 统计区间严格为最近 days 天；为了画完整周，区间前后只补“不可见占位格”，不显示多余方块。
  const end = startOfDay(new Date());
  const rangeStart = addDays(end, -(days - 1));

  const counts = new Map();
  for (const it of items) {
    const raw = new Date(it.ts || 0);
    if (isNaN(raw)) continue;
    const d = startOfDay(raw);
    if (d < rangeStart || d > end) continue;
    const k = dayKey(d);
    counts.set(k, (counts.get(k) || 0) + 1);
  }

  // JS: Sunday=0. 转成 Monday=0 ... Sunday=6。
  const mondayIndex = (d) => (d.getDay() + 6) % 7;
  const gridStart = addDays(rangeStart, -mondayIndex(rangeStart));
  const gridEnd = addDays(end, 6 - mondayIndex(end));

  const cells = [];
  for (let d = new Date(gridStart); d <= gridEnd; d = addDays(d, 1)) {
    const inRange = d >= rangeStart && d <= end;
    const key = dayKey(d);
    cells.push({
      date: new Date(d),
      key,
      count: inRange ? (counts.get(key) || 0) : 0,
      inRange,
    });
  }

  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) {
    weeks.push(cells.slice(i, i + 7));
  }

  // 月份标签与周列使用完全相同的 grid columns，因此不会随 gap 累积漂移。
  // 第一列标当前可见月份；后续月份标记放在“该月 1 日所在周”。
  const monthMarks = [];
  const firstVisible = cells.find(c => c.inRange);
  if (firstVisible) {
    monthMarks.push({
      week: Math.floor(cells.indexOf(firstVisible) / 7),
      month: firstVisible.date.getMonth(),
      year: firstVisible.date.getFullYear(),
    });
  }
  for (let wi = 0; wi < weeks.length; wi++) {
    const firstOfMonth = weeks[wi].find(c => c.inRange && c.date.getDate() === 1);
    if (!firstOfMonth) continue;
    const exists = monthMarks.some(m => m.week === wi && m.month === firstOfMonth.date.getMonth() && m.year === firstOfMonth.date.getFullYear());
    if (!exists) monthMarks.push({ week: wi, month: firstOfMonth.date.getMonth(), year: firstOfMonth.date.getFullYear() });
  }

  return {
    weeks,
    monthMarks,
    rangeStart,
    rangeEnd: end,
    weekdayLabels: ['一','二','三','四','五','六','日'],
  };
}

function intensityClass(n) {
  if (!n) return "bg-slate-100 border-slate-200";
  if (n === 1) return "bg-emerald-100 border-emerald-200";
  if (n === 2) return "bg-emerald-200 border-emerald-300";
  if (n === 3) return "bg-emerald-300 border-emerald-400";
  return "bg-emerald-400 border-emerald-500";
}

/* ============ App ============ */
function App({ onLockPage }) {
  const [cfg, setCfg] = useState(() => loadConfig() || ({
    owner: 'cheneit',
    repo: 'cheneit.github.io',
    branch: 'main',
    dataDir: 'data/files',
    indexPath: 'data/index.json',
    // PDF 分仓配置（新字段；不影响旧 index.json）
    pdf: {
      enabled: true,
      repoPrefix: 'cheneit-pdf-',
      mode: 'yearly',              // yearly => prefix + YYYY
      manualRepo: '',              // 可选：覆盖默认 repo
      branch: 'main',
      dataDir: 'data/files',
      autoCreateRepo: false,       // v3：稳定性优先，推荐先手动建仓并显式授权 PAT
      pagesBase: '',               // 可选：强制 Pages base（留空则按 owner.github.io/repo 推断）
      note: ''
    },
    pages: {
      autoBuild: true,             // v3.2：上传后主动请求 GitHub Pages build
      waitForBuild: true,          // 等到 Pages built 后再报告“发布完成”
      timeoutSec: 180,             // 单仓最长等待时间
      pollSec: 3                   // Pages 状态轮询间隔
    }
  }));
  const [token, setToken] = useState(() => loadToken());

  const [mode, setMode] = useState('preview'); // preview | admin

  const [index, setIndex] = useState({ items: [] });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const [query, setQuery] = useState('');
  const [activeTopic, setActiveTopic] = useState('');
  const [activeTag, setActiveTag] = useState('');
  const [sortBy, setSortBy] = useState('time_desc');

  const [selectedItem, setSelectedItem] = useState(null);
  const [editingItem, setEditingItem] = useState(null);
  const [replacingItem, setReplacingItem] = useState(null);
  const [showBookExport, setShowBookExport] = useState(false);

  const [showAllHome, setShowAllHome] = useState(false);

  function onSaveCfg(newCfg) { setCfg(newCfg); saveConfig(newCfg); }
  function onSaveToken(t) { setToken(t); saveToken(t); }

  async function refreshIndex() {
    setLoading(true); setError('');
    // 显式刷新意味着希望以远端为准，避免沿用页面内旧的 SHA chain。
    invalidateIndexWriteCache(cfg);
    try {
      let data = null;
      if (token) {
        try { data = await ghGetJSONContent(cfg.owner, cfg.repo, cfg.indexPath, token, cfg.branch); }
        catch (e) { console.warn('API 读取 index.json 失败，回退 raw 读取', e); }
      }
      if (!data) data = await ghGetJSONRaw(cfg.owner, cfg.repo, cfg.branch, cfg.indexPath);
      setIndex(normalizeIndexData(data || { items: [] }));
    } catch (e) {
      console.error(e);
      setError('无法加载 index.json：' + e.message);
    } finally {
      setLoading(false);
    }
  }

  useEffect(() => {
    refreshIndex();
  }, [cfg.owner, cfg.repo, cfg.branch, cfg.dataDir, cfg.indexPath]);

  const allItems = index.items || [];

  const topicsCount = useMemo(() => countBy(allItems, it => getTopicsArr(it)), [allItems]);
  const tagsCount = useMemo(() => countBy(allItems, it => (it.tags || [])), [allItems]);

  const allTopics = useMemo(() => topicsCount.map(([k])=>k), [topicsCount]);
  const allTags = useMemo(() => tagsCount.map(([k])=>k), [tagsCount]);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    let arr = [...allItems];

    if (q) {
      arr = arr.filter(i => {
        const topicsArr = getTopicsArr(i);
        const scholarly = scholarlyOf(i);
        const card = paperCardOf(i);
        const text = [
          i.title, i.filename, topicsArr.join(' '),
          (i.tags||[]).join(' '), i.desc,
          card.title, (card.authors||[]).join(' '), (card.affiliations||[]).join(' '),
          card.journal, card.year, card.doi, card.arxivId,
          card.evaluation?.shortReview, card.evaluation?.relevance,
          scholarly.title, scholarly.doi, scholarly.arxivId,
          scholarly.venue, scholarly.abstract, scholarly.primaryTopic,
          (scholarly.keywords || []).join(' '),
          (scholarly.automaticTopics || []).map(t => t.name || t).join(' '),
          authorsOf(i).map(a => a.name).join(' '),
          institutionsOf(i).map(x => x.name).join(' '),
          (i.groups || []).join(' ')
        ].join(' ').toLowerCase();
        return text.includes(q);
      });
    }
    if (activeTopic) arr = arr.filter(i => getTopicsArr(i).includes(activeTopic));
    if (activeTag) arr = arr.filter(i => (i.tags||[]).includes(activeTag));

    arr.sort((a,b) => {
      if (sortBy === 'time_desc') return (b.ts||0) - (a.ts||0);
      if (sortBy === 'time_asc')  return (a.ts||0) - (b.ts||0);
      if (sortBy === 'title_asc') return (a.title||a.filename||'').localeCompare(b.title||b.filename||'');
      if (sortBy === 'title_desc')return (b.title||b.filename||'').localeCompare(a.title||a.filename||'');
      if (sortBy === 'type')      return (a.kind||'').localeCompare(b.kind||'');
      if (sortBy === 'citations_desc') return citationOf(b).count - citationOf(a).count;
      if (sortBy === 'publication_desc') return academicTimestamp(b) - academicTimestamp(a);
      return 0;
    });

    return arr;
  }, [allItems, query, activeTopic, activeTag, sortBy]);

  const isHomeState = useMemo(() => {
    return !query.trim() && !activeTopic && !activeTag;
  }, [query, activeTopic, activeTag]);

  const displayItems = useMemo(() => {
    if (!isHomeState) return filtered;
    if (showAllHome) return filtered;
    return filtered.slice(0, 6);
  }, [filtered, isHomeState, showAllHome]);

  function goHome() {
    setQuery('');
    setActiveTopic('');
    setActiveTag('');
    setSortBy('time_desc');
    setShowAllHome(false);
    requestAnimationFrame(() => window.scrollTo({ top: 0, behavior: 'smooth' }));
  }

  async function handleDeleteItem(item) {
    if (!token) return alert('需要管理员令牌');
    if (!confirm(`确认删除：${item.title || item.filename} ?`)) return;

    try {
      // 1) 删除主文件（优先用 storage；否则用当前仓库相对路径）
      const storage = item.storage;
      if (storage && storage.owner && storage.repo && storage.path) {
        const storageBranch = storage.branch || (cfg.pdf?.branch || 'main');
        const meta = await ghGetContentMeta(storage.owner, storage.repo, storage.path, token, storageBranch);
        if (meta?.sha) await ghDeleteContent(storage.owner, storage.repo, storage.path, `Delete ${item.filename}`, token, meta.sha, storageBranch);
      } else if (item.path && !isAbsoluteUrl(item.path)) {
        const meta = await ghGetContentMeta(cfg.owner, cfg.repo, item.path, token, cfg.branch);
        if (meta?.sha) await ghDeleteContent(cfg.owner, cfg.repo, item.path, `Delete ${item.filename}`, token, meta.sha, cfg.branch);
      }

      // 2) 删除封面（仍在主仓库）
      if (item.imagePath && !isAbsoluteUrl(item.imagePath)) {
        try {
          const m2 = await ghGetContentMeta(cfg.owner, cfg.repo, item.imagePath, token, cfg.branch);
          if (m2?.sha) await ghDeleteContent(cfg.owner, cfg.repo, item.imagePath, `Delete cover for ${item.filename}`, token, m2.sha, cfg.branch);
        } catch(e) { console.warn('删除封面失败', e); }
      }

      // 3) 更新 index.json（不改旧结构，仅删除该条）
      const newData = await updateIndexMain(cfg, token, data => ({
        ...data,
        items: (data.items || []).filter(x => x.id !== item.id)
      }), `Delete item: ${item.filename}`);

      setIndex(newData);
    } catch (e) {
      alert('删除失败：' + e.message);
    }
  }

  async function handleSaveEdit(updated, newCoverFile) {
    if (!token) return alert('需要管理员令牌');
    try {
      const imagePath = await uploadCoverIfNeeded(cfg, token, newCoverFile, updated.imagePath || '');
      const newItem = { ...updated, imagePath };

      const newData = await updateIndexMain(cfg, token, data => ({
        ...data,
        items: (data.items || []).map(x => x.id === newItem.id ? newItem : x)
      }), `Edit item: ${newItem.filename}`);

      setEditingItem(null);
      setIndex(newData);
    } catch (e) {
      alert('保存失败：' + e.message);
    }
  }

  async function handleReplacePdf(item, newFile) {
    if (!token) return alert('需要管理员令牌');
    if (!newFile) return;

    try {
      if (newFile.size > 95 * 1024 * 1024) {
        throw new Error(`文件过大（${humanSize(newFile.size)}）。GitHub 普通仓库单文件接近/超过 100 MB 时会失败，建议改用对象存储或先压缩 PDF。`);
      }

      const buf = new Uint8Array(await newFile.arrayBuffer());
      const b64 = b64EncodeUint8(buf);

      // 替换目标：优先 storage（新条目）；其次旧条目相对路径；最后为 pending PDF 自动生成分仓路径。
      let targetOwner = cfg.owner;
      let targetRepo = cfg.repo;
      let targetPath = item.path;
      let targetBranch = cfg.branch;
      let patch = {};

      if (item.storage?.owner && item.storage?.repo && item.storage?.path) {
        targetOwner = item.storage.owner;
        targetRepo = item.storage.repo;
        targetPath = item.storage.path;
        targetBranch = item.storage.branch || (cfg.pdf?.branch || 'main');
      } else if (item.path && !isAbsoluteUrl(item.path)) {
        targetOwner = cfg.owner;
        targetRepo = cfg.repo;
        targetPath = item.path;
        targetBranch = cfg.branch;
      } else if (item.kind === 'pdf') {
        const d = new Date(item.createdTs || item.ts || Date.now());
        const yy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const pdfCfg = cfg.pdf || {};
        targetOwner = cfg.owner;
        targetRepo = resolvePdfRepoNameFromCfg(cfg, yy);
        targetBranch = pdfCfg.branch || 'main';
        const pdfDataDir = pdfCfg.dataDir || 'data/files';
        targetPath = `${pdfDataDir}/${yy}/${mm}/${item.id || uid()}.pdf`;
        const pagesBase = resolvePagesBaseFromCfg(cfg, targetOwner, targetRepo);
        patch = {
          path: `${pagesBase}/${targetPath}`,
          storage: { owner: targetOwner, repo: targetRepo, branch: targetBranch, path: targetPath }
        };
      } else {
        throw new Error("该条目没有 storage 信息且 path 是绝对 URL，无法确定仓库位置。建议手动补 storage 字段或重新上传该条目。");
      }

      if (!targetPath) throw new Error("缺少 path，无法替换。");

      const meta = await ghGetContentMeta(targetOwner, targetRepo, targetPath, token, targetBranch);
      await ghPutContent(targetOwner, targetRepo, targetPath, b64, `Replace PDF ${item.filename}`, token, meta?.sha, targetBranch);

      const newData = await updateIndexMain(cfg, token, data => ({
        ...data,
        items: (data.items || []).map(x => {
          if (x.id !== item.id) return x;
          return {
            ...x,
            ...patch,
            filename: newFile.name || x.filename,
            size: newFile.size,
            ts: Date.now(),
            uploadStatus: 'ready',
            uploadError: ''
          };
        })
      }), `Replace PDF: ${item.filename}`);

      setReplacingItem(null);
      setIndex(newData);
      alert("替换/补传成功（链接已更新或保持不变）。");
    } catch (e) {
      alert("替换失败：" + e.message);
    }
  }

  async function handleRepairPendingPdf(item, quiet=false) {
    if (!token) {
      if (!quiet) alert('需要管理员令牌');
      throw new Error('缺少管理员令牌');
    }
    try {
      const result = await repairPendingPdfItem(cfg, token, item);
      setIndex(result.newData);
      if (!quiet) alert(`修复成功：已确认 PDF 存在于 ${result.target.repo}，并补写 storage/path/ready。`);
      return result;
    } catch (e) {
      if (!quiet) alert('自动修复失败：' + e.message);
      throw e;
    }
  }

  async function handleRepairAllPendingPdfs() {
    if (!token) return alert('需要管理员令牌');
    const candidates = allItems.filter(isRepairablePdfItem);
    if (!candidates.length) {
      alert('当前没有需要检查的 pending/failed PDF 条目。');
      return { repaired: 0, missing: 0, errors: [] };
    }

    let repaired = 0;
    let missing = 0;
    const errors = [];
    for (const item of candidates) {
      try {
        await handleRepairPendingPdf(item, true);
        repaired += 1;
      } catch (e) {
        missing += 1;
        errors.push(`${item.title || item.filename}: ${e.message}`);
      }
    }

    const extra = errors.length ? `\n\n未自动修复的条目：\n${errors.slice(0, 6).join('\n')}${errors.length > 6 ? `\n…另有 ${errors.length-6} 条` : ''}` : '';
    alert(`pending PDF 检查完成：修复 ${repaired} 条；未找到远端 PDF/需要补传 ${missing} 条。${extra}`);
    return { repaired, missing, errors };
  }


  return (
    <div id="home" className="min-h-full flex flex-col">
      <Header
        mode={mode}
        setMode={setMode}
        query={query}
        setQuery={setQuery}
        onSaveCfg={onSaveCfg}
        token={token}
        setToken={onSaveToken}
        onHome={goHome}
        cfg={cfg}
        onLockPage={onLockPage}
        onOpenBook={() => setShowBookExport(true)}
      />

      <main className="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        {mode === 'admin' ? (
          token ? (
            <>
              <PendingRepairPanel
                items={allItems}
                onRepairAll={handleRepairAllPendingPdfs}
              />
              <MigrationPanel
                cfg={cfg}
                token={token}
                onMigrated={(newData) => { if (newData) setIndex(newData); else refreshIndex(); }}
              />
              <HistoricalMetadataPanel
                cfg={cfg}
                token={token}
                items={allItems}
                onCompleted={(newData) => { if (newData) setIndex(newData); else refreshIndex(); }}
              />
              <PaperCardMigrationPanel
                cfg={cfg}
                token={token}
                items={allItems}
                onCompleted={(newData) => { if (newData) setIndex(newData); else refreshIndex(); }}
              />
              <AdminPanel
                cfg={cfg}
                token={token}
                onUploaded={(newData) => { if (newData) setIndex(newData); else refreshIndex(); }}
              />
            </>
          ) : (
            <AdminPatGate
              onSaveToken={onSaveToken}
              onOpenSettings={() => alert('点击页面右上角“仓库设置”，可以查看完整 GitHub 配置、自检和 PAT 权限说明。')}
            />
          )
        ) : null}

        <div className={cx("grid gap-6", "lg:grid-cols-[1fr_360px]")}>
          <div className="space-y-6">
            {/* Dashboard 只在首页态展示 */}
            {isHomeState ? (
              <Dashboard
                items={filtered}
                topicsCount={topicsCount}
                tagsCount={tagsCount}
                onPickTopic={(t)=>{ setActiveTopic(t); setShowAllHome(true); }}
                onPickTag={(t)=>{ setActiveTag(t); setShowAllHome(true); }}
                onOpen={setSelectedItem}
                onSearch={(value)=>{ setQuery(value); setShowAllHome(true); }}
              />
            ) : null}

            <PreviewPanel
              loading={loading}
              error={error}
              items={displayItems}
              totalAll={filtered.length}
              allTopics={allTopics}
              allTags={allTags}
              activeTopic={activeTopic}
              setActiveTopic={(t)=>{ setActiveTopic(t); setShowAllHome(true); }}
              activeTag={activeTag}
              setActiveTag={(t)=>{ setActiveTag(t); setShowAllHome(true); }}
              sortBy={sortBy}
              setSortBy={setSortBy}
              onOpen={setSelectedItem}
              cfg={cfg}
              mode={mode}
              onEdit={setEditingItem}
              onDeleted={handleDeleteItem}
              onRepair={handleRepairPendingPdf}
              showFold={isHomeState}
              showAllHome={showAllHome}
              setShowAllHome={setShowAllHome}
            />
          </div>

          <div className="lg:sticky lg:top-6 h-fit">
            <ArchiveSidebar
              items={filtered}
              onOpen={(it)=>setSelectedItem(it)}
            />
          </div>
        </div>
      </main>

      <Footer />

      {selectedItem ? (
        <ViewerModal cfg={cfg} item={selectedItem} onClose={() => setSelectedItem(null)} onReplace={() => setReplacingItem(selectedItem)} onEdit={() => { setEditingItem(selectedItem); setSelectedItem(null); }} mode={mode} />
      ) : null}

      {editingItem ? (
        <EditItemModal item={editingItem} onClose={() => setEditingItem(null)} onSave={handleSaveEdit} />
      ) : null}

      {replacingItem ? (
        <ReplacePdfModal
          item={replacingItem}
          onClose={() => setReplacingItem(null)}
          onReplace={(file)=>handleReplacePdf(replacingItem, file)}
        />
      ) : null}

      {showBookExport ? (
        <BookExportModal
          allItems={allItems}
          filteredItems={filtered}
          cfg={cfg}
          onClose={() => setShowBookExport(false)}
        />
      ) : null}
    </div>
  );
}

              </section>

            <div className="space-y-5">
              <section className="border border-[#d8d1c7] bg-[#f7f4ee] p-4">
                <div className="smallcaps mb-3 text-[#b3261e]">Included content</div>
                <div className="space-y-3 text-sm">

                    [includeAbstract,setIncludeAbstract,'摘要 / 归档描述','便于脱离网页快速回顾文章内容'],
                    [includeBibtex,setIncludeBibtex,'BibTeX','始终由当前页面字段即时生成'],
                    [includeCovers,setIncludeCovers,'示意图片','在作者与单位之后以约 1/5 可打印页高通栏展示；不会嵌入 PDF 页面']

                </div>
              </section>

              <section className="journal-rule border-x border-b border-[#d8d1c7] bg-white p-5">
                <div className="smallcaps text-[#b3261e]">Export summary</div>
                <div className="mt-3 grid grid-cols-2 gap-3"><div className="border-t border-[#171717] pt-2"><b className="editorial-title block text-3xl">{selectedItems.length}</b><span className="text-xs text-[#69635b]">待导出文献</span></div><div className="border-t border-[#171717] pt-2"><b className="editorial-title block text-3xl">≈ {estimatedPages}</b><span className="text-xs text-[#69635b]">预计最低页数</span></div></div>
                <div className="mt-4 border-l-4 border-[#b3261e] bg-[#f7f4ee] p-3 text-xs leading-6 text-[#514c45]">
                  点击生成后会打开书籍预览。再点击其中的“保存为 PDF / 打印”，目标选择“另存为 PDF”，纸张保持 B5、纵向、缩放 100%。最终页数会随摘要长度和示意图略有变化。
                </div>
                <button onClick={createBook} disabled={!selectedItems.length || !title.trim()} className={btnClass('primary',cx('mt-4 w-full py-3',(!selectedItems.length||!title.trim())&&'cursor-not-allowed opacity-50'))}>生成 B5 书籍预览</button>
              </section>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}
