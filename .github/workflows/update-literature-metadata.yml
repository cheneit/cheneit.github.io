name: Update literature metadata

on:
  schedule:
    - cron: "17 09 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily 立即刷新引用；backfill 解析剩余 PDF"
        required: true
        default: backfill
        type: choice
        options:
          - backfill
          - daily
      max_items:
        description: "最多处理多少篇；留空即处理全部剩余文献"
        required: false
        default: ""
        type: string
      accept_threshold:
        description: "自动写入阈值，推荐 0.78"
        required: false
        default: "0.78"
        type: string

permissions:
  contents: write

concurrency:
  group: update-literature-metadata
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF metadata reader
        run: python -m pip install --disable-pip-version-check pypdf
      - name: Refresh or backfill metadata
        env:
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
          REPO_LIBRARY_GITHUB_TOKEN: ${{ secrets.REPO_LIBRARY_GITHUB_TOKEN || github.token }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_MAX_ITEMS: ${{ inputs.max_items }}
          INPUT_THRESHOLD: ${{ inputs.accept_threshold }}
        run: |
          MODE="${INPUT_MODE:-daily}"
          THRESHOLD="${INPUT_THRESHOLD:-0.78}"
          ARGS=(--index data/index.json --mode "$MODE" --accept-threshold "$THRESHOLD" --report data/metadata-review.json)
          if [ -n "$INPUT_MAX_ITEMS" ]; then ARGS+=(--max-items "$INPUT_MAX_ITEMS"); fi
          python scripts/update_literature_metadata.py "${ARGS[@]}"
      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-review-${{ github.run_number }}
          path: data/metadata-review.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Save refreshed index and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json
          if [ -f data/metadata-review.json ]; then git add data/metadata-review.json; fi
          if [ -d data/backups ]; then git add data/backups; fi
          git diff --cached --quiet || git commit -m "chore: refresh literature metadata"
          git push
